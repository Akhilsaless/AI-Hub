name: Deploy AI Hub to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run production gates
        run: npm test

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN_RAW" || (echo "CLOUDFLARE_API_TOKEN is missing from GitHub Actions secrets" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing from GitHub Actions secrets" && exit 1)
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID has an invalid format. It must be the 32-character Account ID from the Cloudflare dashboard URL."
            exit 1
          fi

          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^["'\''[:space:]]+//; s/["'\''[:space:]]+$//')
          test -n "$TOKEN" || (echo "CLOUDFLARE_API_TOKEN is empty after normalization" && exit 1)
          echo "::add-mask::$TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Cloudflare API preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          TOKEN_HTTP=$(curl --silent --show-error --output /tmp/cf-token.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/cf-token.json','utf8'));if(!x.success){const e=(x.errors||[]).map(v=>String(v.code)+': '+v.message).join('; ');throw new Error('Cloudflare account API token verification failed ('+process.argv[1]+'): '+e)};console.log('Cloudflare account API token verified as active')" "$TOKEN_HTTP"

          PAGES_HTTP=$(curl --silent --show-error --output /tmp/cf-pages.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ai-hub-93x")
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/cf-pages.json','utf8'));if(!x.success){const e=(x.errors||[]).map(v=>String(v.code)+': '+v.message).join('; ');throw new Error('Cloudflare Pages preflight failed ('+process.argv[1]+'): '+e+'. Check that the Account ID belongs to the same account as the token and that the token has Pages Write access.')}console.log('Cloudflare Pages project access verified')" "$PAGES_HTTP"

      - name: Stamp release
        run: node -e "require('node:fs').writeFileSync('Public/release.json', JSON.stringify({commit:process.env.GITHUB_SHA, deployedAt:new Date().toISOString()}))"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.28.0

      - name: Deploy existing Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy Public --project-name=ai-hub-93x --branch=main

      - name: Verify production release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://ai-hub-93x.pages.dev/release.json --output /tmp/ai-hub-release.json
          node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('/tmp/ai-hub-release.json','utf8'));if(x.commit!==process.env.EXPECTED_SHA)throw new Error('Production is not serving the expected commit');console.log('Verified production commit',x.commit)"
