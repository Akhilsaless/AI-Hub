<!doctype html><html data-theme="ai-night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>HOPE</title><style>
*{box-sizing:border-box}html{--bg:#080b12;--panel:#10151f;--panel2:#151c28;--text:#f7f9ff;--muted:#8e9aaf;--line:#232d3d;--accent:#77d9ff;--accent2:#8d78ff;--user:#edf8ff;--userText:#071019;--glow:#6bdcff55;--wash:radial-gradient(circle at 50% -15%,#253c7355,transparent 45%);color-scheme:dark}html[data-theme="ai-day"]{--bg:#f4f8ff;--panel:#ffffffcc;--panel2:#edf4ff;--text:#111827;--muted:#697386;--line:#dbe5f2;--accent:#087ea4;--accent2:#6d5dfc;--user:#172033;--userText:#fff;--glow:#53c7ff45;--wash:radial-gradient(circle at 50% -15%,#a9dfff88,transparent 45%);color-scheme:light}html[data-theme="dragon-night"]{--bg:#0b0908;--panel:#15110e;--panel2:#1d1712;--text:#f5ead9;--muted:#a9957e;--line:#35291f;--accent:#e45c38;--accent2:#c89a52;--user:#ead9bd;--userText:#1a100a;--glow:#e3532d45;--wash:radial-gradient(circle at 50% -15%,#7e2b1f55,transparent 44%);color-scheme:dark}html[data-theme="dragon-day"]{--bg:#f3ede1;--panel:#fffaf0dd;--panel2:#eae0cf;--text:#241c16;--muted:#786b5d;--line:#d7c8b2;--accent:#9d3929;--accent2:#9b6b2e;--user:#2a2018;--userText:#fff8ea;--glow:#b64d3340;--wash:radial-gradient(circle at 50% -15%,#e6cfa888,transparent 46%);color-scheme:light}body{margin:0;background:var(--wash),var(--bg);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,sans-serif;transition:.25s}.app{max-width:960px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:5;padding:12px 16px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.round{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--panel2);color:var(--text);font-size:20px}.dragon{width:42px;height:42px;filter:drop-shadow(0 0 12px var(--glow));color:var(--accent)}.dragon svg{width:100%;height:100%}.title{font-weight:850;letter-spacing:.08em}.sub,.meta{font-size:12px;color:var(--muted)}.topActions{margin-left:auto;display:flex;gap:7px}.chat{padding:26px 16px 160px}.welcome{min-height:52vh;display:grid;place-items:center;text-align:center}.welcomeInner{max-width:650px}.welcome .dragon{width:78px;height:78px;margin:auto}.welcome h1{font-size:clamp(32px,7vw,54px);margin:14px 0 8px;letter-spacing:-.04em}.welcome p{color:var(--muted);font-size:16px;line-height:1.55}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.suggest{padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--text);text-align:left}.msg{max-width:82%;padding:12px 15px;margin:12px 0;border-radius:19px;white-space:pre-wrap;line-height:1.55}.user{margin-left:auto;background:var(--user);color:var(--userText)}.assistant{background:var(--panel);border:1px solid var(--line)}.thinking{display:flex;align-items:center;gap:9px;color:var(--muted)}.dots{display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:p 1.15s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes p{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}.composerWrap{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}.composer{max-width:928px;margin:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 45px #0002;border-radius:28px;padding:8px;display:flex;gap:7px;align-items:flex-end}.input{flex:1;min-height:43px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px 5px}.send{background:var(--text);color:var(--bg)}.mic.on{box-shadow:0 0 22px var(--glow);border-color:var(--accent)}.files{max-width:928px;margin:auto;padding:7px 14px;color:var(--muted);font-size:12px}.drawer{position:fixed;z-index:20;inset:0 auto 0 0;width:min(360px,88vw);background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;transform:translateX(-105%);transition:.22s;overflow:auto}.drawer.open{transform:none}.scrim{position:fixed;inset:0;background:#0008;z-index:19}.hidden{display:none!important}.nav{width:100%;padding:12px;border:0;border-radius:13px;background:transparent;color:var(--text);text-align:left;font-size:14px}.nav:hover{background:var(--panel2)}.section{margin:19px 10px 7px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.historyItem{display:flex;gap:5px}.historyItem .nav{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sheet{position:fixed;z-index:30;left:12px;right:12px;bottom:12px;max-width:680px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;max-height:82dvh;overflow:auto;box-shadow:0 24px 80px #0005}.task{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--panel2)}.btn{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--panel2);color:var(--text);margin:5px}.primary{background:var(--text);color:var(--bg)}.actionGrid,.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action,.themeCard{padding:15px 12px;border:1px solid var(--line);border-radius:15px;background:var(--panel2);color:var(--text);text-align:left;font:inherit}.action b,.themeCard b{display:block;margin-bottom:4px}.action span,.themeCard span{font-size:11px;color:var(--muted)}.themeCard.active{outline:2px solid var(--accent)}@media(max-width:600px){.msg{max-width:94%}.suggestions{grid-template-columns:1fr}.topActions .label{display:none}}
</style></head><body><main class="app"><header class="top"><button class="round" id="menu">☰</button><div class="dragon" aria-label="HOPE dragon"><svg viewBox="0 0 64 64" fill="none"><path d="M52 10c-9 1-15 5-19 12-4-5-10-8-19-8 5 4 8 8 9 13-6 0-11 3-14 8 7-2 12-1 16 3-5 3-8 8-8 14 5-5 10-7 16-6 5 1 9 4 13 8-1-7-5-12-11-15 8-3 14-8 17-15-5 3-10 4-15 3 6-4 11-10 15-17Z" fill="currentColor"/><path d="M34 26c4-6 9-9 15-10-3 5-7 9-12 12l-3-2Z" fill="var(--accent2)"/><circle cx="39" cy="31" r="1.8" fill="var(--bg)"/></svg></div><div><div class="title">HOPE</div><div class="sub" id="state">Ready</div></div><div class="topActions"><button class="round" id="themeBtn" title="Themes">◐</button><button class="round" id="newChat" title="New chat">＋</button></div></header><section class="chat"><div id="welcome" class="welcome"><div class="welcomeInner"><div class="dragon"><svg viewBox="0 0 64 64" fill="none"><path d="M52 10c-9 1-15 5-19 12-4-5-10-8-19-8 5 4 8 8 9 13-6 0-11 3-14 8 7-2 12-1 16 3-5 3-8 8-8 14 5-5 10-7 16-6 5 1 9 4 13 8-1-7-5-12-11-15 8-3 14-8 17-15-5 3-10 4-15 3 6-4 11-10 15-17Z" fill="currentColor"/><path d="M34 26c4-6 9-9 15-10-3 5-7 9-12 12l-3-2Z" fill="var(--accent2)"/></svg></div><h1>What can I help you build?</h1><p>HOPE remembers what matters across your work, while each chat stays clean and focused.</p><div class="suggestions"><button class="suggest" onclick="seed('Continue my current project from where we left off')">Continue a project</button><button class="suggest" onclick="seed('Research this for me: ')">Research something</button><button class="suggest" onclick="seed('Help me build or fix this: ')">Build or fix code</button><button class="suggest" onclick="openTasks()">Review automations</button></div></div></div><div id="messages"></div></section><div class="composerWrap"><div class="files" id="picked"></div><div class="composer"><button class="round" id="attach">＋</button><textarea id="input" class="input" placeholder="Message HOPE…"></textarea><button class="round mic" id="mic">🎙</button><button class="round send" id="send">↑</button></div></div></main><input id="file" type="file" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.tsx,.jsx,.html,.css" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><div id="scrim" class="scrim hidden"></div><aside id="drawer" class="drawer"><button class="round" id="close">×</button><div class="section">HOPE</div><button class="nav" onclick="startNewChat();closeDrawer()">＋ New chat</button><button class="nav" onclick="location.href='/command-center.html'">⌂ Command Center</button><button class="nav" onclick="location.href='/connect'">◉ Connected apps</button><div class="section">Recent chats</div><div id="history"></div><div class="section">Workspace</div><button class="nav" onclick="openTasks()">◷ Scheduled & Automations</button><button class="nav" onclick="showCapabilities()">✦ Capabilities</button><div class="section">System</div><button class="nav" onclick="openThemes()">◐ Themes</button><button class="nav" onclick="location.href='/'">◎ AI Hub</button></aside><div id="sheet" class="sheet hidden"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let attachments=[],voiceReply=false,recognition=null,threadId='',threadMessages=[];const THEMES={'dragon-day':'Dragon · Day','dragon-night':'Dragon · Night','ai-day':'AI · Day','ai-night':'AI · Night'};function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function histories(){try{return JSON.parse(localStorage.getItem('hopeThreads')||'[]')}catch{return []}}function saveHistories(v){localStorage.setItem('hopeThreads',JSON.stringify(v.slice(0,40)))}function persistThread(){if(!threadMessages.length)return;let h=histories(),x=h.find(v=>v.id===threadId),title=(threadMessages.find(m=>m.role==='user')?.content||'New chat').slice(0,52);const item={id:threadId,title,updated:Date.now(),messages:threadMessages.slice(-80)};h=x?h.map(v=>v.id===threadId?item:v):[item,...h];h.sort((a,b)=>b.updated-a.updated);saveHistories(h);renderHistory()}function renderHistory(){$('#history').innerHTML=histories().slice(0,16).map(h=>`<div class="historyItem"><button class="nav" onclick="loadThread('${h.id}')">${esc(h.title)}</button></div>`).join('')||'<div class="meta" style="padding:10px">No chats yet.</div>'}function loadThread(id){const h=histories().find(x=>x.id===id);if(!h)return;threadId=id;threadMessages=h.messages||[];renderMessages();closeDrawer()}function startNewChat(){threadId=uuid();threadMessages=[];renderMessages();$('#input').focus()}function renderMessages(){$('#messages').innerHTML=threadMessages.map(m=>`<div class="msg ${m.role==='user'?'user':'assistant'}">${esc(m.content)}${m.meta?`<div class="meta">${esc(m.meta)}</div>`:''}</div>`).join('');$('#welcome').classList.toggle('hidden',threadMessages.length>0);scrollTo(0,document.body.scrollHeight)}async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('Owner login required')}if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}function add(t,role,meta=''){threadMessages.push({role,content:t,meta});renderMessages();persistThread()}function thinking(label='Thinking'){const d=document.createElement('div');d.className='msg assistant thinking';d.innerHTML=`<span>${esc(label)}</span><span class="dots"><i></i><i></i><i></i></span>`;$('#messages').appendChild(d);scrollTo(0,document.body.scrollHeight);return d}function setTheme(t){if(!THEMES[t])return;document.documentElement.dataset.theme=t;localStorage.setItem('hopeTheme',t);document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();closeSheet()}function speak(t){if(!voiceReply||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.01;speechSynthesis.speak(u)}async function boot(){setTheme(localStorage.getItem('hopeTheme')||'ai-night');threadId=uuid();renderHistory();renderMessages();try{await api('/api/hope/capabilities');$('#state').textContent='Memory on · tools ready'}catch(e){$('#state').textContent='Some tools need attention'}setupVoice()}function setupVoice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('#mic').title='Voice input is unavailable in this browser';return}recognition=new R();recognition.lang=navigator.language||'en-IN';recognition.interimResults=false;recognition.onstart=()=>$('#mic').classList.add('on');recognition.onend=()=>$('#mic').classList.remove('on');recognition.onresult=e=>{$('#input').value=[...e.results].map(x=>x[0].transcript).join(' ');send()}}async function analyzeFile(file,prompt){const fd=new FormData();fd.append('file',file);fd.append('prompt',prompt||'Analyze this attachment and extract the information relevant to my request.');const r=await fetch('/api/hope/media',{method:'POST',body:fd}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`Attachment HTTP ${r.status}`);return j.text}async function send(){const input=$('#input'),text=input.value.trim();if(!text&&!attachments.length)return;input.value='';add(text||`Analyze ${attachments.length} attachment(s)`,'user');const w=thinking(attachments.length?'Reading attachments':'Thinking');try{let enriched=text;for(const f of attachments){w.firstChild.textContent='Reading '+f.name;const analysis=await analyzeFile(f,text);enriched+=`\n\nAttachment ${f.name}:\n${analysis}`}attachments=[];renderPicked();w.firstChild.textContent='Reasoning';const j=await api('/api/agents/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:'primary',message:enriched,mode:'normal'})});w.remove();add(j.text,'assistant',j.verified?'Verified action':'');speak(j.text)}catch(e){w.remove();add(`I couldn't complete that: ${e.message}`,'assistant')}}function renderPicked(){$('#picked').textContent=attachments.length?attachments.map(f=>f.name).join(' · '):''}function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.add('hidden')}function closeSheet(){$('#sheet').classList.add('hidden');$('#scrim').classList.add('hidden')}function showSheet(html){$('#sheet').innerHTML=html;$('#sheet').classList.remove('hidden');$('#scrim').classList.remove('hidden')}function openLauncher(){showSheet(`<h3>What do you want HOPE to do?</h3><div class="actionGrid"><button class="action" onclick="closeSheet();$('#file').click()"><b>📎 Attach</b><span>Files, images or documents</span></button><button class="action" onclick="closeSheet();$('#camera').click()"><b>📷 Camera</b><span>Take a photo</span></button><button class="action" onclick="closeSheet();openTasks()"><b>⏱ Automations</b><span>Schedule and review work</span></button><button class="action" onclick="seed('Research this with current sources: ')"><b>⌕ Research</b><span>Investigate a topic</span></button><button class="action" onclick="seed('Help me with this GitHub/code task: ')"><b>⌘ Code</b><span>Build, inspect or fix code</span></button><button class="action" onclick="location.href='/connect'"><b>◉ Connected apps</b><span>Google, GitHub and tools</span></button><button class="action" onclick="seed('Use the right specialist agents to help me: ')"><b>✦ Specialists</b><span>Delegate complex work</span></button><button class="action" onclick="openThemes()"><b>◐ Themes</b><span>Change HOPE's atmosphere</span></button></div><button class="btn" onclick="closeSheet()">Close</button>`)}function seed(t){closeSheet();$('#input').value=t;$('#input').focus()}function openThemes(){closeDrawer();showSheet(`<h3>Choose a HOPE theme</h3><div class="themeGrid">${Object.entries(THEMES).map(([k,v])=>`<button class="themeCard ${document.documentElement.dataset.theme===k?'active':''}" onclick="setTheme('${k}')"><b>${esc(v)}</b><span>${k.includes('dragon')?'Cinematic dragon atmosphere':'Futuristic intelligence atmosphere'}</span></button>`).join('')}</div><button class="btn" onclick="closeSheet()">Close</button>`)}$('#menu').onclick=()=>{$('#drawer').classList.add('open');$('#scrim').classList.remove('hidden')};$('#close').onclick=closeDrawer;$('#scrim').onclick=()=>{closeDrawer();closeSheet()};$('#attach').onclick=openLauncher;$('#themeBtn').onclick=openThemes;$('#newChat').onclick=startNewChat;for(const id of ['file','camera']){$('#'+id).onchange=e=>{attachments=[...attachments,...e.target.files];renderPicked();e.target.value=''}}$('#send').onclick=send;$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#mic').onclick=()=>{if(!recognition){voiceReply=!voiceReply;$('#mic').classList.toggle('on',voiceReply);return}voiceReply=true;try{recognition.start()}catch{}};async function openTasks(){closeDrawer();closeSheet();const j=await api('/api/agents/tasks');showSheet(`<h3>Scheduled & Automations</h3>${(j.tasks||[]).map(t=>`<div class="task"><b>${esc(t.title)}</b><div class="meta">${esc(t.status)} · ${esc(t.schedule||'one-time')}</div>${t.status==='awaiting_approval'?`<button class="btn primary" onclick="task(${t.id},'approve')">Approve</button>`:''}${['pending','approved','failed','completed'].includes(t.status)?`<button class="btn" onclick="task(${t.id},'execute')">Run now</button>`:''}</div>`).join('')||'<div class="meta">No tasks yet.</div>'}<button class="btn" onclick="closeSheet()">Close</button>`)}async function task(id,action){await api('/api/agents/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,action})});openTasks()}async function showCapabilities(){closeDrawer();const c=await api('/api/hope/capabilities');showSheet(`<h3>HOPE capabilities</h3>${Object.entries(c.capabilities||{}).map(([k,v])=>`<div class="task"><b>${esc(k.replaceAll('_',' '))}</b><div class="meta">${String(v.status||'').includes('ready')?'Ready':'Available when configured'}</div></div>`).join('')}<button class="btn" onclick="closeSheet()">Close</button>`)}boot();
</script></body></html>
