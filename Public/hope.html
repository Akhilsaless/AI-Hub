<!doctype html><html data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>HOPE · AI Hub</title><style>*{box-sizing:border-box}html{--bg:#080b12;--panel:#10151f;--panel2:#151c28;--text:#f7f9ff;--muted:#8e9aaf;--line:#263247;--accent:#77d9ff;--user:#edf8ff;--userText:#071019;color-scheme:dark}html[data-theme="day"]{--bg:#f4f8ff;--panel:#fff;--panel2:#edf4ff;--text:#111827;--muted:#697386;--line:#d5e2ef;--accent:#087ea4;--user:#172033;--userText:#fff;color-scheme:light}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}.app{max-width:980px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:8;padding:12px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(22px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.round,.chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px}.brand{font-weight:900;letter-spacing:.08em}.sub{font-size:12px;color:var(--muted)}.admin{margin-left:auto;text-decoration:none;padding:9px 12px;border-radius:12px;background:#f5c451;color:#17120a;font-weight:850}.chat{padding:20px 14px 150px}.welcome{min-height:52vh;display:grid;place-items:center;text-align:center}.welcome h1{font-size:clamp(34px,7vw,58px);margin:0 0 9px}.welcome p{max-width:620px;color:var(--muted);font-size:16px;line-height:1.5}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}.suggest{padding:14px;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text)}.msg{max-width:84%;padding:12px 15px;border-radius:19px;margin:11px 0;white-space:pre-wrap;line-height:1.55}.user{margin-left:auto;background:var(--user);color:var(--userText)}.assistant{background:var(--panel);border:1px solid var(--line)}.agentCard{margin:8px 0 14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.agentTop{display:flex;align-items:center;gap:8px;font-weight:800}.agentMeta{margin-top:7px;color:var(--muted);font-size:12px;white-space:pre-wrap}.agentBtns{display:flex;gap:8px;margin-top:12px}.ok,.cancel{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.ok{background:var(--text);color:var(--bg)}.cancel{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.composerWrap{position:fixed;bottom:0;left:0;right:0;z-index:9;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}.chip{border-radius:999px;padding:8px 11px;white-space:nowrap}.picked{max-width:948px;margin:auto;color:var(--muted);font-size:12px;padding:4px 10px}.composer{max-width:948px;margin:auto;display:flex;align-items:flex-end;gap:7px;padding:8px;border:1px solid var(--line);border-radius:27px;background:var(--panel)}textarea{flex:1;min-height:44px;max-height:145px;resize:none;background:transparent;border:0;outline:0;color:var(--text);padding:11px 4px;font:inherit}.send{background:var(--text);color:var(--bg)}.drawer{position:fixed;z-index:30;inset:0 auto 0 0;width:min(370px,90vw);background:var(--panel);border-right:1px solid var(--line);padding:16px;transform:translateX(-105%);transition:.2s;overflow:auto}.drawer.open{transform:none}.scrim{position:fixed;inset:0;background:#0008;z-index:29}.hidden{display:none!important}.section{margin:18px 7px 7px;color:var(--muted);font-size:11px;text-transform:uppercase}.nav{width:100%;padding:11px 9px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:11px}.thread{display:flex;gap:6px;align-items:center}.thread .nav{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tiny{border:0;background:transparent;color:var(--muted);padding:7px}.sheet{position:fixed;z-index:40;left:12px;right:12px;bottom:12px;max-width:680px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:17px;max-height:80vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{padding:15px 12px;border:1px solid var(--line);border-radius:15px;background:var(--panel2);color:var(--text);text-align:left;cursor:pointer}.action b{display:block}.action span{font-size:11px;color:var(--muted)}.moodRow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.moodBtn.active{outline:2px solid var(--accent)}.moodBadge{font-size:11px;color:var(--muted);margin-left:4px}@media(max-width:600px){.msg{max-width:94%}.suggestions,.grid{grid-template-columns:1fr}.admin{padding:8px 9px}.agentBtns{flex-wrap:wrap}}</style></head><body><main class="app"><header class="top"><button class="round" id="menu">☰</button><div><div class="brand">HOPE <span class="moodBadge" id="moodBadge">Normal</span></div><div class="sub" id="state">Ready</div></div><a id="admin" class="admin hidden" href="/command-center.html">Admin</a><button class="round" id="theme">◐</button><button class="round" id="newChat">＋</button></header><section class="chat"><div id="welcome" class="welcome"><div><h1>Ask HOPE anything.</h1><p>General AI, research, projects, learning and connected tools — one private workspace for every AI Hub user.</p><div class="suggestions"><button class="suggest" onclick="seed('Research this for me: ')">Research something</button><button class="suggest" onclick="seed('Help me build or fix this: ')">Build or fix something</button><button class="suggest" onclick="seed('Explain this simply: ')">Explain something</button><button class="suggest" onclick="openTools()">Use HOPE tools</button></div></div></div><div id="messages"></div></section><div class="composerWrap"><div class="picked" id="picked"></div><div class="composer"><button class="round" id="plus">＋</button><textarea id="input" placeholder="Message HOPE…"></textarea><button class="round" id="voice">🔊</button><button class="round" id="mic">🎙</button><button class="round send" id="send">↑</button></div></div></main><input id="file" type="file" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.tsx,.jsx,.html,.css" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><div id="scrim" class="scrim hidden"></div><aside id="drawer" class="drawer"><button class="round" id="close">×</button><div class="section">HOPE</div><button class="nav" onclick="startNew();closeDrawer()">＋ New chat</button><div class="section">Recent chats</div><div id="history"></div><div class="section">Workspace</div><button class="nav" onclick="location.href='/account.html'">My Hub / Projects</button><button class="nav" onclick="location.href='/connectors.html'">Connected apps</button><button class="nav" onclick="location.href='/learn.html'">Academy</button><button class="nav" onclick="location.href='/models.html'">Models</button><div class="section">System</div><button class="nav" onclick="toggleTheme()">Toggle theme</button><button id="adminNav" class="nav hidden" onclick="location.href='/command-center.html'">Admin / Command Center</button><button class="nav" onclick="location.href='/account.html'">Account</button></aside><div id="sheet" class="sheet hidden"></div><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let mood=localStorage.hopeMood||'normal',threadId='',threads=[],attachments=[],busy=false,voiceOn=localStorage.hopeVoice==='1',pendingAgent=null;document.documentElement.dataset.theme=localStorage.hopeTheme||'night';const moodNames={normal:'Normal',happy:'Happy',funny:'Very Funny',angry:'Angry'};function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)}function add(role,text){welcome.classList.add('hidden');messages.insertAdjacentHTML('beforeend',`<div class="msg ${role}">${esc(text)}</div>`);scrollTo(0,document.body.scrollHeight)}function addAgentCard(d){welcome.classList.add('hidden');const preview=d.preview||d.payload||{},detail=Object.entries(preview).filter(([,v])=>String(v||'').trim()).map(([k,v])=>`${k}: ${v}`).join('\n');const buttons=d.requiresConfirmation?`<div class="agentBtns"><button class="ok" onclick="continueAgent(true)">Confirm</button><button class="cancel" onclick="cancelAgent()">Cancel</button></div>`:'';messages.insertAdjacentHTML('beforeend',`<div class="agentCard" id="agentCard"><div class="agentTop">${d.agentStatus==='completed'?'✓ Verified':d.agentStatus==='failed'?'⚠ Failed':d.requiresConfirmation?'Review action':'HOPE Agent'}</div><div class="agentMeta">${esc(d.text||detail||'')}</div>${buttons}</div>`);scrollTo(0,document.body.scrollHeight)}function voiceState(){voice.style.outline=voiceOn?'2px solid var(--accent)':''}function speak(text){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[*#`]/g,''));u.rate=mood==='funny'?1.05:1;u.pitch=mood==='happy'?1.08:mood==='angry'?.92:1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en-IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}async function api(u,o){const r=await fetch(u,{cache:'no-store',...o}),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/login.html?next='+encodeURIComponent(location.pathname);throw Error('Sign in required')}if(!r.ok&&r.status!==409)throw Error(j.error||`HTTP ${r.status}`);return {...j,httpStatus:r.status}}async function boot(){voiceState();renderMood();const me=await api('/api/account/me');if(me.user?.isOwner){admin.classList.remove('hidden');adminNav.classList.remove('hidden')}await refreshThreads();if(threads[0])await loadThread(threads[0].id);else startNew()}async function refreshThreads(){const d=await api('/api/user/hope/chat');threads=d.threads||[];history.innerHTML=threads.map(t=>`<div class="thread"><button class="nav" onclick="loadThread('${t.id}')">${esc(t.title)}</button><button class="tiny" onclick="renameThread('${t.id}','${esc(t.title)}')">✎</button><button class="tiny" onclick="deleteThread('${t.id}')">🗑</button></div>`).join('')||'<div class="sub">No chats yet.</div>'}async function loadThread(id){threadId=id;messages.innerHTML='';pendingAgent=null;const d=await api('/api/user/hope/chat?thread='+encodeURIComponent(id));(d.messages||[]).forEach(x=>add(x.role==='user'?'user':'assistant',x.content));closeDrawer()}function startNew(){threadId=uuid();messages.innerHTML='';welcome.classList.remove('hidden');attachments=[];pendingAgent=null;renderPicked();input.focus()}async function renameThread(id,current){const title=prompt('Rename conversation',current);if(!title)return;await api('/api/user/hope/chat',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({threadId:id,title})});await refreshThreads()}async function deleteThread(id){if(!confirm('Delete this conversation? HOPE memory is kept.'))return;await api('/api/user/hope/chat?thread='+encodeURIComponent(id),{method:'DELETE'});if(threadId===id)startNew();await refreshThreads()}function seed(t){input.value=t;input.focus()}function setMood(m){mood=m;localStorage.hopeMood=m;renderMood();closeSheet();const intro={normal:'Normal mode selected.',happy:'Happy mode on — good energy, clear answers.',funny:'Very Funny mode on. I’ll keep it useful, but your boring questions are now in danger. 😄',angry:'Angry mode on — sharp, fiery, direct, but still respectful.'}[m];add('assistant',intro)}function renderMood(){moodBadge.textContent=moodNames[mood]||'Normal'}voice.onclick=()=>{voiceOn=!voiceOn;localStorage.hopeVoice=voiceOn?'1':'0';voiceState();if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel()};function openTools(){sheet.classList.remove('hidden');scrim.classList.remove('hidden');sheet.innerHTML=`<h2>HOPE Actions</h2><div class="grid"><button class="action" onclick="file.click();closeSheet()"><b>📎 Files & images</b><span>Attach documents, screenshots or photos</span></button><button class="action" onclick="camera.click();closeSheet()"><b>📷 Camera</b><span>Take a photo and attach it</span></button><button class="action" onclick="seed('Research this for me: ');closeSheet()"><b>🔎 Research</b><span>Use live research when needed</span></button><button class="action" onclick="location.href='/connectors.html'"><b>🔌 Connected apps</b><span>Gmail, Calendar, GitHub and more</span></button><button class="action" onclick="location.href='/account.html'"><b>📁 Projects</b><span>Continue project workspaces</span></button><button class="action" onclick="location.href='/learn.html'"><b>⚡ Learn</b><span>Open AI Hub Academy</span></button></div><div class="section">HOPE mood</div><div class="moodRow"><button class="chip moodBtn ${mood==='normal'?'active':''}" onclick="setMood('normal')">Normal</button><button class="chip moodBtn ${mood==='happy'?'active':''}" onclick="setMood('happy')">😊 Happy</button><button class="chip moodBtn ${mood==='funny'?'active':''}" onclick="setMood('funny')">😂 Very Funny</button><button class="chip moodBtn ${mood==='angry'?'active':''}" onclick="setMood('angry')">😤 Angry</button></div><button class="chip" style="margin-top:14px" onclick="closeSheet()">Close</button>`}function closeSheet(){sheet.classList.add('hidden');scrim.classList.add('hidden')}plus.onclick=openTools;scrim.onclick=()=>{closeSheet();closeDrawer()};function openDrawer(){drawer.classList.add('open');scrim.classList.remove('hidden')}function closeDrawer(){drawer.classList.remove('open');if(sheet.classList.contains('hidden'))scrim.classList.add('hidden')}menu.onclick=openDrawer;close.onclick=closeDrawer;newChat.onclick=startNew;function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='day'?'night':'day';localStorage.hopeTheme=document.documentElement.dataset.theme}theme.onclick=toggleTheme;function renderPicked(){picked.textContent=attachments.length?attachments.map(x=>x.name).join(' · '):''}function toB64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}async function pickFiles(list){attachments=[];for(const f of [...list].slice(0,4)){if(f.size>6500000){alert(`${f.name} is too large. Keep individual files under 6.5 MB.`);continue}const item={name:f.name,type:f.type||'application/octet-stream',size:f.size};if(f.size<500000&&(/^(text\/)/.test(item.type)||/\.(txt|md|csv|json|js|ts|tsx|jsx|html|css)$/i.test(f.name))){try{item.text=(await f.text()).slice(0,30000)}catch{}}else if(/^(image\/|application\/pdf$)/.test(item.type)){try{item.data=await toB64(f)}catch{}}attachments.push(item)}renderPicked()}file.onchange=e=>pickFiles(e.target.files);camera.onchange=e=>pickFiles(e.target.files);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='en-IN';rec.interimResults=false;mic.onclick=()=>{state.textContent='Listening…';rec.start()};rec.onresult=e=>{input.value=e.results[0][0].transcript;state.textContent='Ready';sendMessage()};rec.onerror=()=>state.textContent='Microphone error'}else mic.onclick=()=>alert('Speech input is not supported in this browser.');async function continueAgent(confirmAction){if(!pendingAgent)return;state.textContent='Executing…';try{const d=await api('/api/user/hope/agent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({runId:pendingAgent.agentRunId,objective:pendingAgent.plan?.objective||pendingAgent.original||'',payload:pendingAgent.preview||pendingAgent.payload||pendingAgent.plan?.payload||{},confirm:confirmAction})});if(d.needsInput){addAgentCard({...d,agentStatus:'needs_input'});state.textContent='Needs input';return}const text=d.text||d.summary||d.error||'Action finished.';add('assistant',text);addAgentCard({...d,agentStatus:d.status});speak(text);state.textContent=d.verified?'Verified ✓':d.status==='failed'?'Failed':'Ready';pendingAgent=null}catch(e){add('assistant','Action failed: '+e.message);state.textContent='Failed';pendingAgent=null}}function cancelAgent(){if(!pendingAgent)return;add('assistant','Cancelled. I did not perform the external action.');pendingAgent=null;const c=$('#agentCard');if(c)c.remove();state.textContent='Cancelled'}async function sendMessage(){const raw=input.value.trim();if((!raw&&!attachments.length)||busy)return;busy=true;input.value='';const shown=raw||`Attached: ${attachments.map(x=>x.name).join(', ')}`;add('user',shown);state.textContent='Thinking…';try{const d=await api('/api/user/hope/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({threadId,message:raw,mood,attachments})});threadId=d.threadId||threadId;if(d.agent){pendingAgent={...d,original:raw};if(d.requiresConfirmation||d.needsInput||d.connectRequired){add('assistant',d.text||d.error||'HOPE needs your attention.');addAgentCard(d);state.textContent=d.requiresConfirmation?'Waiting for confirmation':d.needsInput?'Needs input':'Connect app'}else{add('assistant',d.text||'');if(d.verified||d.agentStatus==='failed')addAgentCard(d);speak(d.text||'');state.textContent=d.verified?'Verified ✓':d.agentStatus==='failed'?'Failed':'Ready';pendingAgent=null}}else{add('assistant',d.text||'');speak(d.text||'');state.textContent=d.provider?`${d.provider} · ${d.model||'HOPE'}${d.route==='user-connector'?' · My model':''}`:'Ready'}attachments=[];renderPicked();await refreshThreads()}catch(e){add('assistant','Error: '+e.message);state.textContent='Error'}finally{busy=false}}send.onclick=sendMessage;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});boot().catch(e=>state.textContent=e.message)</script></body></html>
