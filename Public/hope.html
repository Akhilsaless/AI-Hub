<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0d"><title>HOPE</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0d;color:#f7f7f8;font:15px Inter,system-ui,sans-serif}.app{max-width:920px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:5;padding:14px 16px;background:#090a0de8;backdrop-filter:blur(18px);border-bottom:1px solid #22252c;display:flex;align-items:center;gap:11px}.round{width:42px;height:42px;border:0;border-radius:50%;background:#20232a;color:#fff;font-size:20px}.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 3%,#9ddcff 12%,#7868ff 42%,#17202f 75%);box-shadow:0 0 28px #6f7cff55}.title{font-weight:800}.sub,.meta{font-size:12px;color:#9297a3}.chat{padding:22px 16px 155px}.hero{padding:20px;border:1px solid #252832;border-radius:24px;background:linear-gradient(145deg,#151820,#0d0f14);margin-bottom:18px}.hero h2{font-size:30px;margin:0 0 7px}.hero p{color:#aeb3be;margin:0;line-height:1.45}.caps{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.cap{font-size:11px;padding:6px 9px;border-radius:99px;background:#20242c;color:#cdd2dc}.msg{max-width:86%;padding:12px 15px;margin:10px 0;border-radius:18px;white-space:pre-wrap;line-height:1.45}.user{margin-left:auto;background:#f4f4f5;color:#111}.assistant{background:#17191f;border:1px solid #242730}.composerWrap{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#090a0d 20%)}.composer{max-width:888px;margin:auto;background:#191b21;border:1px solid #30333c;border-radius:26px;padding:8px;display:flex;gap:7px;align-items:flex-end}.input{flex:1;min-height:43px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:#fff;font:inherit;padding:11px 5px}.send{background:#fff;color:#111}.mic.on{background:#fff;color:#111;box-shadow:0 0 24px #fff5}.files{padding:8px 16px;color:#aeb3be;font-size:12px}.drawer{position:fixed;z-index:20;inset:0 auto 0 0;width:min(350px,86vw);background:#111317;border-right:1px solid #292c33;padding:18px 14px;transform:translateX(-105%);transition:.2s}.drawer.open{transform:none}.scrim{position:fixed;inset:0;background:#0008;z-index:19}.hidden{display:none}.nav{width:100%;padding:13px;border:0;border-radius:14px;background:transparent;color:#fff;text-align:left;font-size:15px}.nav:hover{background:#20232a}.section{margin:20px 10px 7px;color:#7f8590;font-size:11px;text-transform:uppercase}.sheet{position:fixed;z-index:30;left:12px;right:12px;bottom:12px;max-width:650px;margin:auto;background:#17191e;border:1px solid #30333b;border-radius:24px;padding:18px;max-height:80dvh;overflow:auto}.task{padding:12px;border:1px solid #30333c;border-radius:14px;margin:8px 0;background:#101217}.btn{border:0;border-radius:11px;padding:9px 11px;background:#292c33;color:#fff;margin:5px}.primary{background:#fff;color:#111}.actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{padding:15px 12px;border:1px solid #30333c;border-radius:15px;background:#101217;color:#fff;text-align:left;font:inherit}.action b{display:block;margin-bottom:4px}.action span{font-size:11px;color:#9297a3}@media(max-width:600px){.hero h2{font-size:27px}.msg{max-width:94%}}</style></head><body><main class="app"><header class="top"><button class="round" id="menu">☰</button><div class="orb"></div><div><div class="title">HOPE</div><div class="sub" id="state">Starting…</div></div></header><section class="chat"><div class="hero"><h2>What are we building?</h2><p>Talk, attach files or images, use connected tools, research, code and continue your work from one place.</p><div class="caps" id="caps"></div></div><div id="messages"></div></section><div class="composerWrap"><div class="files" id="picked"></div><div class="composer"><button class="round" id="attach">＋</button><textarea id="input" class="input" placeholder="Message HOPE…"></textarea><button class="round mic" id="mic">🎙</button><button class="round send" id="send">↑</button></div></div></main><input id="file" type="file" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.tsx,.jsx,.html,.css" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><div id="scrim" class="scrim hidden"></div><aside id="drawer" class="drawer"><button class="round" id="close">×</button><div class="section">HOPE</div><button class="nav" onclick="closeDrawer()">◯ Chat</button><button class="nav" onclick="location.href='/command-center.html'">⌂ Command Center</button><button class="nav" onclick="location.href='/connect'">◉ Plugins & Connectors</button><div class="section">Workspace</div><button class="nav" onclick="openTasks()">◷ Scheduled & Automations</button><button class="nav" onclick="showCapabilities()">✦ Capabilities</button><div class="section">System</div><button class="nav" onclick="location.href='/'">◎ AI Hub</button></aside><div id="sheet" class="sheet hidden"></div><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let attachments=[],voiceReply=false,recognition=null;async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('Owner login required')}if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}function bubble(t,w,meta=''){const d=document.createElement('div');d.className='msg '+w;d.innerHTML=esc(t)+(meta?`<div class="meta">${esc(meta)}</div>`:'');$('#messages').appendChild(d);scrollTo(0,document.body.scrollHeight);return d}function friendlyStatus(k,v){const s=String(v?.status||'').toLowerCase();if(s.includes('ready'))return 'Ready';if(s.includes('need'))return 'Connect model';if(s.includes('unavailable'))return 'Unavailable';return s?'Available':'Checking'}function speak(t){if(!voiceReply||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.02;speechSynthesis.speak(u)}async function boot(){try{const [c,h]=await Promise.all([api('/api/hope/capabilities'),api('/api/agents/chat?agent=primary')]);$('#caps').innerHTML=Object.entries(c.capabilities||{}).map(([k,v])=>`<span class="cap">${esc(k.replaceAll('_',' '))} · ${esc(friendlyStatus(k,v))}</span>`).join('');$('#state').textContent='Memory on · tools ready';$('#messages').innerHTML=(h.messages||[]).map(m=>`<div class="msg ${m.role==='user'?'user':'assistant'}">${esc(m.content)}</div>`).join('')}catch(e){$('#state').textContent=e.message}setupVoice()}function setupVoice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('#mic').title='Speech recognition is not supported by this browser';return}recognition=new R();recognition.lang=navigator.language||'en-IN';recognition.interimResults=false;recognition.onstart=()=>$('#mic').classList.add('on');recognition.onend=()=>$('#mic').classList.remove('on');recognition.onresult=e=>{const t=[...e.results].map(x=>x[0].transcript).join(' ');$('#input').value=t;send()};recognition.onerror=e=>bubble(`Voice input couldn't start: ${e.error}`,'assistant')}async function analyzeFile(file,prompt){const fd=new FormData();fd.append('file',file);fd.append('prompt',prompt||'Analyze this attachment and extract the information relevant to my request.');const r=await fetch('/api/hope/media',{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`Attachment HTTP ${r.status}`);return j.text}async function send(){const input=$('#input'),text=input.value.trim();if(!text&&!attachments.length)return;input.value='';bubble(text||`Analyze ${attachments.length} attachment(s)`,'user');const w=bubble('HOPE is working…','assistant');try{let enriched=text;for(const f of attachments){const analysis=await analyzeFile(f,text);enriched+=`\n\nAttachment ${f.name}:\n${analysis}`}attachments=[];renderPicked();const j=await api('/api/agents/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:'primary',message:enriched,mode:'normal'})});w.innerHTML=esc(j.text)+`<div class="meta">${esc(j.provider||'HOPE')}${j.verified?' · verified':''}</div>`;speak(j.text)}catch(e){w.textContent=`I couldn't complete that: ${e.message}`}}function renderPicked(){$('#picked').textContent=attachments.length?attachments.map(f=>f.name).join(' · '):''}function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.add('hidden')}function closeSheet(){$('#sheet').classList.add('hidden');$('#scrim').classList.add('hidden')}function openLauncher(){$('#sheet').innerHTML=`<h3>What do you want HOPE to do?</h3><div class="actionGrid"><button class="action" onclick="closeSheet();$('#file').click()"><b>📎 Attach</b><span>Files, images or documents</span></button><button class="action" onclick="closeSheet();$('#camera').click()"><b>📷 Camera</b><span>Take a photo for HOPE</span></button><button class="action" onclick="closeSheet();openTasks()"><b>⏱ Automations</b><span>Create, review or run tasks</span></button><button class="action" onclick="promptAction('Research this topic with current sources: ')"><b>⌕ Research</b><span>Investigate with sources</span></button><button class="action" onclick="promptAction('Help me with this GitHub/code task: ')"><b>⌘ Code</b><span>Repositories and development</span></button><button class="action" onclick="location.href='/connect'"><b>◉ Connected apps</b><span>Google, GitHub and tools</span></button><button class="action" onclick="promptAction('Use the right specialist agents to help me: ')"><b>✦ Specialists</b><span>Delegate complex work</span></button><button class="action" onclick="closeSheet();showCapabilities()"><b>◎ Capabilities</b><span>See what HOPE can use</span></button></div><button class="btn" onclick="closeSheet()">Close</button>`;$('#sheet').classList.remove('hidden');$('#scrim').classList.remove('hidden')}function promptAction(prefix){closeSheet();$('#input').value=prefix;$('#input').focus()}$('#menu').onclick=()=>{$('#drawer').classList.add('open');$('#scrim').classList.remove('hidden')};$('#close').onclick=closeDrawer;$('#scrim').onclick=()=>{closeDrawer();closeSheet()};$('#attach').onclick=openLauncher;for(const id of ['file','camera']){$('#'+id).onchange=e=>{attachments=[...attachments,...e.target.files];renderPicked();e.target.value=''}}$('#send').onclick=send;$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#mic').onclick=()=>{if(!recognition){voiceReply=!voiceReply;$('#mic').classList.toggle('on',voiceReply);return}voiceReply=true;try{recognition.start()}catch{}};async function openTasks(){closeDrawer();closeSheet();const j=await api('/api/agents/tasks');$('#sheet').innerHTML=`<h3>Scheduled & Automations</h3>${(j.tasks||[]).map(t=>`<div class="task"><b>${esc(t.title)}</b><div class="meta">${esc(t.status)} · ${esc(t.schedule||'one-time')}</div>${t.status==='awaiting_approval'?`<button class="btn primary" onclick="task(${t.id},'approve')">Approve</button>`:''}${['pending','approved','failed','completed'].includes(t.status)?`<button class="btn" onclick="task(${t.id},'execute')">Run now</button>`:''}</div>`).join('')||'<div class="meta">No tasks yet.</div>'}<button class="btn" onclick="closeSheet()">Close</button>`;$('#sheet').classList.remove('hidden');$('#scrim').classList.remove('hidden')}async function task(id,action){await api('/api/agents/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,action})});openTasks()}async function showCapabilities(){closeDrawer();closeSheet();const c=await api('/api/hope/capabilities');$('#sheet').innerHTML=`<h3>HOPE capabilities</h3>${Object.entries(c.capabilities||{}).map(([k,v])=>`<div class="task"><b>${esc(k.replaceAll('_',' '))}</b><div class="meta">${esc(friendlyStatus(k,v))}</div></div>`).join('')}<button class="btn" onclick="closeSheet()">Close</button>`;$('#sheet').classList.remove('hidden');$('#scrim').classList.remove('hidden')}boot();</script></body></html>
