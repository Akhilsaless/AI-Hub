<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0d"><title>Hope · AI Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0d;color:#f7f7f8;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:920px;margin:auto}.top{position:sticky;top:0;z-index:5;background:rgba(9,10,13,.88);backdrop-filter:blur(18px);padding:14px 16px;border-bottom:1px solid #202127;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 3%,#9ddcff 12%,#7868ff 42%,#17202f 75%);box-shadow:0 0 30px #6f7cff55}.brand h1{font-size:17px;margin:0}.sub{font-size:12px;color:#9297a3}.nav{display:flex;gap:7px}.chip{border:1px solid #2d3038;background:#14161b;color:#d8dae0;border-radius:999px;padding:8px 11px}.chat{padding:22px 16px 150px}.hero{padding:22px;border:1px solid #252832;border-radius:24px;background:linear-gradient(145deg,#151820,#0d0f14);margin-bottom:18px}.hero h2{font-size:34px;margin:0 0 8px}.hero p{color:#aeb3be;line-height:1.45;margin:0}.brief{margin-top:14px;padding:14px;border-radius:16px;background:#151821;color:#dfe2e8}.msg{max-width:82%;padding:12px 15px;margin:10px 0;border-radius:18px;line-height:1.45;white-space:pre-wrap}.user{margin-left:auto;background:#f4f4f5;color:#111}.assistant{background:#17191f;border:1px solid #242730}.meta{font-size:11px;color:#7e8490;margin-top:6px}.composerWrap{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#090a0d 20%)}.composer{max-width:888px;margin:auto;background:#191b21;border:1px solid #30333c;border-radius:25px;padding:9px;display:flex;gap:8px;align-items:flex-end}.plus,.send{width:43px;height:43px;border-radius:50%;border:0;font-size:25px}.plus{background:#2a2d34;color:#fff}.send{background:#f4f4f5;color:#111}.input{flex:1;min-height:43px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:#fff;font:inherit;padding:10px 5px}.mode{font-size:12px;color:#9ca1ad;padding:4px 10px}.menu{position:fixed;left:14px;bottom:82px;width:min(390px,calc(100vw - 28px));background:#202227;border:1px solid #343740;border-radius:28px;padding:10px;z-index:9}.hidden{display:none!important}.action{width:100%;display:flex;align-items:center;gap:14px;padding:13px;border:0;background:transparent;color:#fff;border-radius:16px;text-align:left;font-size:16px}.ico{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#34373e}.action small{display:block;color:#9297a3;margin-top:2px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:end center;z-index:12;padding:16px}.sheet{width:min(650px,100%);max-height:84dvh;overflow:auto;background:#17191e;border:1px solid #30333b;border-radius:28px;padding:20px}.sheet h3{margin-top:0}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:700}.primary{background:#fff;color:#111}.secondary{background:#292c33;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.field{width:100%;padding:12px;border-radius:12px;border:1px solid #353842;background:#0f1115;color:#fff;margin:7px 0}@media(max-width:600px){.hero h2{font-size:29px}.msg{max-width:92%}.nav .hub{display:none}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="orb"></div><div><h1>Hope</h1><div class="sub" id="state">Checking AI Hub…</div></div></div><div class="nav"><button class="chip" onclick="location.href='/connect'">Connect</button><button class="chip" onclick="location.href='/command-center.html'">Command Center</button><button class="chip hub" onclick="location.href='/'">AI Hub</button></div></header><section class="chat"><div class="hero"><h2>What are we building?</h2><p>I can reason, remember, plan missions, coordinate tools and specialists, and keep track of what needs your attention.</p><div class="brief" id="brief">Checking what needs your attention…</div></div><div id="messages"></div></section><div class="composerWrap"><div class="composer"><button class="plus" id="plus">+</button><textarea class="input" id="input" rows="1" placeholder="Message Hope…"></textarea><button class="send" id="send">↑</button></div><div class="mode" id="modeLabel">Normal reasoning · zero-cost routing preferred</div></div></main><div class="menu hidden" id="menu"></div><input type="file" id="camera" accept="image/*" capture="environment" hidden><input type="file" id="photos" accept="image/*" multiple hidden><input type="file" id="files" multiple hidden><div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div><script>const $=s=>document.querySelector(s);let agent='primary',mode='normal',attachments=[];const actions=[['command','⌂','Command Center','Goals, missions, approvals, trust and attention'],['camera','📷','Camera','Capture an image'],['photos','🖼️','Photos','Choose images'],['files','📎','Files','Attach documents or code'],['tools','◉','Connect Center','Models, Google, GitHub and tools'],['hard','◌','Think Harder','Deeper reasoning'],['research','⌕','Deep Research','Research specialist'],['builder','⌘','Build an App','Product builder'],['automation','⏱','Automations','Create agent tasks'],['agents','✦','Choose Agent','Hope + specialists']];const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('Owner login required')}if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}function renderMenu(){$('#menu').innerHTML=actions.map(a=>`<button class="action" onclick="act('${a[0]}')"><span class="ico">${a[1]}</span><span>${a[2]}<small>${a[3]}</small></span></button>`).join('')}function closeMenu(){$('#menu').classList.add('hidden')}function openSheet(h){$('#sheet').innerHTML=h;$('#modal').classList.remove('hidden')}function closeSheet(){$('#modal').classList.add('hidden')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};async function boot(){renderMenu();try{const b=await api('/api/agents/brief');$('#brief').textContent=b.message;$('#state').textContent=`Memory on · ${b.status?.healthyProviders||0} healthy route(s)`;await loadMessages()}catch(e){$('#brief').textContent=e.message}}async function loadMessages(){const j=await api('/api/agents/chat?agent='+encodeURIComponent(agent));$('#messages').innerHTML=(j.messages||[]).map(m=>`<div class="msg ${m.role==='user'?'user':'assistant'}">${esc(m.content)}</div>`).join('')}function bubble(t,w,m=''){const d=document.createElement('div');d.className='msg '+w;d.innerHTML=esc(t)+(m?`<div class="meta">${esc(m)}</div>`:'');$('#messages').appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}async function send(){const i=$('#input'),t=i.value.trim();if(!t)return;i.value='';bubble(t,'user');const w=bubble('Hope is thinking…','assistant');try{const j=await api('/api/agents/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent,message:t,mode,attachments:attachments.map(x=>({name:x.name,type:x.type,size:x.size}))})});w.innerHTML=esc(j.text)+`<div class="meta">${esc(j.provider)} · ${esc(j.model)}${j.memoriesUsed?` · recalled ${j.memoriesUsed} memories`:''}</div>`;attachments=[]}catch(e){w.textContent=`I couldn't complete that: ${e.message}`}}function pick(id){$('#'+id).click();closeMenu()}['camera','photos','files'].forEach(id=>{$('#'+id).onchange=e=>{attachments=[...attachments,...e.target.files];bubble('Attached: '+[...e.target.files].map(f=>f.name).join(', '),'user','Ready for Hope');e.target.value=''}});async function act(id){if(id==='command'){location.href='/command-center.html';return}if(['camera','photos','files'].includes(id))return pick(id);closeMenu();if(id==='tools'){location.href='/connect';return}if(id==='hard'){mode=mode==='hard'?'normal':'hard';$('#modeLabel').textContent=mode==='hard'?'Think Harder ON · deeper reasoning requested':'Normal reasoning · zero-cost routing preferred';return}if(id==='research'||id==='builder'){agent=id;await loadMessages();$('#state').textContent=(id==='research'?'Research specialist':'Product Builder')+' · memory on';return}if(id==='automation')return openSheet(`<h3>Create automation task</h3><input class="field" id="taskTitle" placeholder="What should Hope do?"><input class="field" id="taskSchedule" placeholder="Schedule/condition"><div class="row"><button class="btn primary" onclick="saveTask()">Save task</button><button class="btn secondary" onclick="closeSheet()">Cancel</button></div>`);if(id==='agents'){const j=await api('/api/agents');return openSheet(`<h3>Choose agent</h3>${j.agents.map(a=>`<button class="action" onclick="choose('${a.id}','${esc(a.name)}')"><span class="ico">✦</span><span>${esc(a.name)}<small>${esc(a.role)}</small></span></button>`).join('')}`)}}async function choose(id,n){agent=id;closeSheet();$('#state').textContent=n+' · memory on';await loadMessages()}async function saveTask(){const title=$('#taskTitle').value.trim(),schedule=$('#taskSchedule').value.trim();if(!title)return;const j=await api('/api/agents/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent,title,schedule:schedule||null,requiresApproval:true})});closeSheet();bubble('Automation task saved: '+title,'assistant',j.note)}$('#plus').onclick=()=>$('#menu').classList.toggle('hidden');$('#send').onclick=send;$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};boot();</script></body></html>
