<!doctype html><html data-theme="ai-night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>HOPE</title><link rel="stylesheet" href="/hope-3d.css"><style>*{box-sizing:border-box}html{--bg:#080b12;--panel:#10151fee;--panel2:#151c28;--text:#f7f9ff;--muted:#8e9aaf;--line:#263247;--accent:#77d9ff;--accent2:#8d78ff;--user:#edf8ff;--userText:#071019;--glow:#6bdcff55;color-scheme:dark}html[data-theme="ai-day"]{--bg:#f4f8ff;--panel:#ffffffdd;--panel2:#edf4ff;--text:#111827;--muted:#697386;--line:#d5e2ef;--accent:#087ea4;--accent2:#6d5dfc;--user:#172033;--userText:#fff;--glow:#53c7ff45;color-scheme:light}html[data-theme="dragon-night"]{--bg:#0b0908;--panel:#15110eee;--panel2:#211811;--text:#f5ead9;--muted:#a9957e;--line:#3b2b20;--accent:#e45c38;--accent2:#d3a455;--user:#ead9bd;--userText:#1a100a;--glow:#e3532d45;color-scheme:dark}html[data-theme="dragon-day"]{--bg:#f3ede1;--panel:#fffaf0e8;--panel2:#eae0cf;--text:#241c16;--muted:#786b5d;--line:#d7c8b2;--accent:#9d3929;--accent2:#9b6b2e;--user:#2a2018;--userText:#fff8ea;--glow:#b64d3340;color-scheme:light}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}.app{max-width:960px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:5;padding:12px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.round{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--panel2);color:var(--text);font-size:19px;display:grid;place-items:center}.round svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}.dragon{width:42px;height:42px;color:var(--accent);filter:drop-shadow(0 0 12px var(--glow))}.dragon svg{width:100%;height:100%}.title{font-weight:850;letter-spacing:.08em}.sub,.meta{font-size:12px;color:var(--muted)}.topActions{margin-left:auto;display:flex;gap:7px}.chat{padding:26px 16px 160px}.welcome{min-height:56vh;display:grid;place-items:center;text-align:center}.welcomeInner{max-width:660px}.welcome .dragon{width:90px;height:90px;margin:auto}.welcome h1{font-size:clamp(32px,7vw,54px);margin:12px 0 8px;letter-spacing:-.04em}.welcome p{color:var(--muted);font-size:16px;line-height:1.55}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.suggest{padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--text);text-align:left}.msg{max-width:84%;padding:12px 15px;margin:12px 0;border-radius:19px;white-space:pre-wrap;line-height:1.55}.user{margin-left:auto;background:var(--user);color:var(--userText)}.assistant{background:var(--panel);border:1px solid var(--line)}.thinking{display:flex;gap:9px;color:var(--muted)}.dots{display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:p 1.15s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes p{35%{opacity:1;transform:translateY(-4px)}0%,70%,100%{opacity:.25}}.composerWrap{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 25%)}.composer{max-width:928px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:8px;display:flex;gap:7px;align-items:flex-end}.input{flex:1;min-height:43px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px 5px}.send{background:var(--text);color:var(--bg)}.files{max-width:928px;margin:auto;padding:7px 14px;color:var(--muted);font-size:12px}.drawer{position:fixed;z-index:20;inset:0 auto 0 0;width:min(360px,88vw);background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;transform:translateX(-105%);transition:.22s;overflow:auto}.drawer.open{transform:none}.scrim{position:fixed;inset:0;background:#0009;z-index:19}.hidden{display:none!important}.nav{width:100%;padding:12px;border:0;border-radius:13px;background:transparent;color:var(--text);text-align:left;font-size:14px}.section{margin:19px 10px 7px;color:var(--muted);font-size:11px;text-transform:uppercase}.sheet{position:fixed;z-index:30;left:12px;right:12px;bottom:12px;max-width:680px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;max-height:82dvh;overflow:auto}.task{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--panel2)}.btn{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--panel2);color:var(--text);margin:5px}.primary{background:var(--text);color:var(--bg)}.actionGrid,.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action,.themeCard{padding:15px 12px;border:1px solid var(--line);border-radius:15px;background:var(--panel2);color:var(--text);text-align:left;font:inherit}.action span,.themeCard span{font-size:11px;color:var(--muted)}.themeCard.active{outline:2px solid var(--accent)}@media(max-width:600px){.msg{max-width:94%}.suggestions{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><button class="round" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="dragon"><svg viewBox="0 0 64 64"><path d="M52 10c-9 1-15 5-19 12-4-5-10-8-19-8 5 4 8 8 9 13-6 0-11 3-14 8 7-2 12-1 16 3-5 3-8 8-8 14 5-5 10-7 16-6 5 1 9 4 13 8-1-7-5-12-11-15 8-3 14-8 17-15-5 3-10 4-15 3 6-4 11-10 15-17Z" fill="currentColor"/></svg></div><div><div class="title">HOPE</div><div class="sub" id="state">Ready</div></div><div class="topActions"><button class="round" id="themeBtn" aria-label="Themes"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-1.2-1-2-2.2-2h-1.3a2 2 0 0 1-2-2V6.7C15.5 4.7 14 3 12 3Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/></svg></button><button class="round" id="newChat" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></header><section class="chat"><div id="welcome" class="welcome"><div class="welcomeInner"><div class="dragon"><svg viewBox="0 0 64 64"><path d="M52 10c-9 1-15 5-19 12-4-5-10-8-19-8 5 4 8 8 9 13-6 0-11 3-14 8 7-2 12-1 16 3-5 3-8 8-8 14 5-5 10-7 16-6 5 1 9 4 13 8-1-7-5-12-11-15 8-3 14-8 17-15-5 3-10 4-15 3 6-4 11-10 15-17Z" fill="currentColor"/></svg></div><h1>What can I help you build?</h1><p>One intelligent workspace. Clean conversations. Persistent memory. Real tools.</p><div class="suggestions"><button class="suggest" onclick="seed('Continue my current project from where we left off')">Continue a project</button><button class="suggest" onclick="seed('Research this for me: ')">Research something</button><button class="suggest" onclick="seed('Help me build or fix this: ')">Build or fix code</button><button class="suggest" onclick="openTasks()">Review automations</button></div></div></div><div id="messages"></div></section><div class="composerWrap"><div class="files" id="picked"></div><div class="composer"><button class="round" id="attach" aria-label="Tools"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><textarea id="input" class="input" placeholder="Message HOPE…"></textarea><button class="round" id="mic" aria-label="Voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg></button><button class="round send" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></div></main><input id="file" type="file" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.tsx,.jsx,.html,.css" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><div id="scrim" class="scrim hidden"></div><aside id="drawer" class="drawer"><button class="round" id="close">×</button><div class="section">HOPE</div><button class="nav" onclick="startNewChat();closeDrawer()">＋ New chat</button><button class="nav" onclick="location.href='/command-center.html'">Command Center</button><button class="nav" onclick="location.href='/connect'">Connected apps</button><div class="section">Recent chats</div><div id="history"></div><div class="section">Workspace</div><button class="nav" onclick="openTasks()">Scheduled & Automations</button><button class="nav" onclick="showCapabilities()">Capabilities</button><div class="section">System</div><button class="nav" onclick="openThemes()">Themes</button><button class="nav" onclick="location.href='/'">AI Hub</button></aside><div id="sheet" class="sheet hidden"></div><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let attachments=[],recognition=null,threadId='',threadMessages=[];const THEMES={'dragon-day':'Dragon · Day','dragon-night':'Dragon · Night','ai-day':'AI · Day','ai-night':'AI · Night'};const I={attach:'<svg viewBox="0 0 24 24"><path d="M8 12.5 14.5 6a3 3 0 0 1 4.2 4.2L10 19a5 5 0 0 1-7-7l9-9"/></svg>',camera:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg>',auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>',research:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M8 10h5M10.5 7.5v5"/></svg>',code:'<svg viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>',apps:'<svg viewBox="0 0 24 24"><path d="M8 12H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4M16 12h4a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-4M8 8h8M12 8v12"/></svg>',agents:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 2-6 5-6s5 2 5 6M14 15c3-1 6 1 6 5"/></svg>',theme:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-1-1-2-2-2h-2a2 2 0 0 1-2-2V6c0-2-1-3-3-3Z"/></svg>'};function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)}function histories(){try{return JSON.parse(localStorage.hopeThreads||'[]')}catch{return []}}function persist(){if(!threadMessages.length)return;let h=histories(),item={id:threadId,title:(threadMessages.find(x=>x.role==='user')?.content||'New chat').slice(0,52),updated:Date.now(),messages:threadMessages.slice(-80)};h=[item,...h.filter(x=>x.id!==threadId)].slice(0,40);localStorage.hopeThreads=JSON.stringify(h);history()}function history(){$('#history').innerHTML=histories().slice(0,16).map(h=>`<button class="nav" onclick="loadThread('${h.id}')">${esc(h.title)}</button>`).join('')||'<div class="meta">No chats yet.</div>'}function loadThread(id){let h=histories().find(x=>x.id===id);if(h){threadId=id;threadMessages=h.messages;render();closeDrawer()}}function startNewChat(){threadId=uuid();threadMessages=[];render()}function render(){$('#messages').innerHTML=threadMessages.map(m=>`<div class="msg ${m.role==='user'?'user':'assistant'}">${esc(m.content)}${m.meta?`<div class="meta">${esc(m.meta)}</div>`:''}</div>`).join('');$('#welcome').classList.toggle('hidden',threadMessages.length>0)}async function api(u,o){let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('Owner login required')}if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}function add(t,r,m=''){threadMessages.push({role:r,content:t,meta:m});render();persist()}function think(label){let d=document.createElement('div');d.className='msg assistant thinking';d.innerHTML=`${esc(label)} <span class="dots"><i></i><i></i><i></i></span>`;$('#messages').appendChild(d);return d}function setTheme(t){document.documentElement.dataset.theme=t;localStorage.hopeTheme=t;closeSheet()}async function analyze(f,p){let fd=new FormData();fd.append('file',f);fd.append('prompt',p||'Analyze this attachment.');let r=await fetch('/api/hope/media',{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw Error(j.error);return j.text}async function send(){let t=$('#input').value.trim();if(!t&&!attachments.length)return;$('#input').value='';add(t||`Analyze ${attachments.length} attachment(s)`,'user');let w=think(attachments.length?'Reading attachments':'Thinking');try{let e=t;for(const f of attachments)e+=`\n\nAttachment ${f.name}:\n${await analyze(f,t)}`;attachments=[];picked();w.firstChild.textContent='Reasoning ';let j=await api('/api/agents/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:'primary',message:e,mode:'normal'})});w.remove();add(j.text,'assistant',j.verified?'Verified action':'')}catch(x){w.remove();add(`I couldn't complete that: ${x.message}`,'assistant')}}function picked(){$('#picked').textContent=attachments.map(f=>f.name).join(' · ')}function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.add('hidden')}function closeSheet(){$('#sheet').classList.add('hidden');$('#scrim').classList.add('hidden')}function sheet(h){$('#sheet').innerHTML=h;$('#sheet').classList.remove('hidden');$('#scrim').classList.remove('hidden')}function card(icon,title,sub,onclick){return `<button class="action" onclick="${onclick}"><span class="ico">${I[icon]}</span><b>${title}</b><span>${sub}</span></button>`}function launcher(){sheet(`<h3>HOPE tools</h3><div class="actionGrid">${card('attach','Attach','Files, images and documents',"closeSheet();$('#file').click()")}${card('camera','Camera','Capture something for HOPE',"closeSheet();$('#camera').click()")}${card('auto','Automations','Schedule and review work','closeSheet();openTasks()')}${card('research','Research','Investigate with current sources',"seed('Research this with current sources: ')")}${card('code','Code','Build, inspect or fix repositories',"seed('Help me with this GitHub/code task: ')")}${card('apps','Connected apps','Google, GitHub and tools',"location.href='/connect'")}${card('agents','Specialists','Delegate complex work',"seed('Use the right specialist agents to help me: ')")}${card('theme','Themes','Switch immersive environment','openThemes()')}</div><button class="btn" onclick="closeSheet()">Close</button>`)}function seed(t){closeSheet();$('#input').value=t;$('#input').focus()}function openThemes(){closeDrawer();sheet(`<h3>Immersive environments</h3><div class="themeGrid">${Object.entries(THEMES).map(([k,v])=>`<button data-t="${k}" class="themeCard ${document.documentElement.dataset.theme===k?'active':''}" onclick="setTheme('${k}')"><b>${v}</b><span>${k.includes('dragon')?'Cinematic dragon realm':'Futuristic AI space'}</span></button>`).join('')}</div><button class="btn" onclick="closeSheet()">Close</button>`)}async function openTasks(){closeDrawer();closeSheet();let j=await api('/api/agents/tasks');sheet(`<h3>Scheduled & Automations</h3>${(j.tasks||[]).map(t=>`<div class="task"><b>${esc(t.title)}</b><div class="meta">${esc(t.status)} · ${esc(t.schedule||'one-time')}</div>${t.status==='awaiting_approval'?`<button class="btn primary" onclick="task(${t.id},'approve')">Approve</button>`:''}<button class="btn" onclick="task(${t.id},'execute')">Run now</button></div>`).join('')||'No tasks yet.'}`)}async function task(id,action){await api('/api/agents/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,action})});openTasks()}async function showCapabilities(){closeDrawer();let c=await api('/api/hope/capabilities');sheet(`<h3>Capabilities</h3>${Object.entries(c.capabilities||{}).map(([k,v])=>`<div class="task"><b>${esc(k.replaceAll('_',' '))}</b><div class="meta">${String(v.status||'').includes('ready')?'Ready':'Available when configured'}</div></div>`).join('')}`)}$('#menu').onclick=()=>{$('#drawer').classList.add('open');$('#scrim').classList.remove('hidden')};$('#close').onclick=closeDrawer;$('#scrim').onclick=()=>{closeDrawer();closeSheet()};$('#attach').onclick=launcher;$('#themeBtn').onclick=openThemes;$('#newChat').onclick=startNewChat;$('#send').onclick=send;$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};for(const id of ['file','camera'])$('#'+id).onchange=e=>{attachments=[...attachments,...e.target.files];picked();e.target.value=''};const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R){recognition=new R();recognition.lang=navigator.language||'en-IN';recognition.onstart=()=>$('#mic').classList.add('on');recognition.onend=()=>$('#mic').classList.remove('on');recognition.onresult=e=>{$('#input').value=e.results[0][0].transcript;send()};$('#mic').onclick=()=>recognition.start()}else $('#mic').onclick=()=>alert('Voice input is not supported by this browser.');setTheme(localStorage.hopeTheme||'ai-night');startNewChat();history();api('/api/hope/capabilities').then(()=>$('#state').textContent='Memory on · tools ready').catch(()=>$('#state').textContent='Some tools need attention');</script></body></html>
