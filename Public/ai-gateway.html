<!doctype html><html data-theme="ai-night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Gateway · HOPE</title><link rel="stylesheet" href="/hub-themes.css"><script src="/theme-runtime.js"></script><style>*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui}.wrap{max-width:1180px;margin:auto;padding:22px}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top b{margin-right:auto}.card{background:var(--hub-panel);border:1px solid var(--hub-line);border-radius:20px;padding:18px;margin:12px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:14px;border:1px solid var(--hub-line);border-radius:14px}.metric b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.muted{color:var(--hub-muted)}.pill{border:1px solid var(--hub-line);border-radius:999px;padding:4px 8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--hub-line)}@media(max-width:760px){.metrics,.grid{grid-template-columns:1fr}.scroll{overflow:auto}}</style></head><body><main class="wrap"><nav class="top"><b>ADMIN → AI GATEWAY</b><a href="/ai-providers.html">Providers</a><a href="/ai-playground.html">Playground</a><a href="/command-center.html">Command Center</a></nav><section id="summary" class="metrics"></section><section class="grid" id="providers"></section><section class="card"><h2>Recent routing activity</h2><p class="muted">Prompt contents are intentionally not stored or displayed here.</p><div class="scroll"><table><thead><tr><th>Feature</th><th>Provider / Model</th><th>Latency</th><th>Tokens</th><th>Status</th><th>Time</th></tr></thead><tbody id="recent"></tbody></table></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/providers/dashboard',{cache:'no-store',credentials:'include'}),j=await r.json();if(r.status===401){location.href='/';return}if(!r.ok)throw Error(j.error||'Dashboard failed');const s=j.summary;summary.innerHTML=`<div class="metric"><b>${s.connectedProviders}</b>Connected providers</div><div class="metric"><b>${s.requestsToday}</b>Requests today</div><div class="metric"><b>${s.tokensToday}</b>Tokens today</div><div class="metric"><b>${s.averageResponseMs} ms</b>Average response</div><div class="metric"><b>$${Number(s.estimatedCostTodayUsd).toFixed(4)}</b>Cost today</div><div class="metric"><b>$${Number(s.estimatedCostMonthUsd).toFixed(4)}</b>Cost this month</div><div class="metric"><b>${s.activeModels}</b>Active models</div><div class="metric"><b>${s.fallbackCount}</b>Provider errors/fallback signals</div>`;providers.innerHTML=j.providers.map(p=>`<article class="card"><div class="row"><h3 style="margin-right:auto">${esc(p.name)}</h3><span class="pill">${esc(p.health)}</span></div><p><b>${p.requests}</b> requests · <b>${p.successRate}%</b> success · <b>${p.avgLatencyMs} ms</b></p><p class="muted">${p.activeModels} active models · ${p.freeModels} free-capable · ${p.errors} errors</p>${p.lastError?`<p class="muted">Last health error: ${esc(p.lastError)}</p>`:''}</article>`).join('');recent.innerHTML=j.recent.map(x=>`<tr><td>${esc(x.feature)}</td><td>${esc(x.provider)}<br><span class="muted">${esc(x.model_id)}</span></td><td>${x.latency_ms} ms</td><td>${Number(x.input_tokens)+Number(x.output_tokens)}</td><td>${x.success?'Success':esc(x.error_class||'Failed')}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}load().catch(e=>document.body.insertAdjacentHTML('beforeend',`<p>${esc(e.message)}</p>`))</script></body></html>
