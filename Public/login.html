<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Sign in · AI Hub</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#080b12;color:#f7f9ff;font:15px Inter,system-ui,sans-serif;padding:20px}.card{width:min(430px,100%);background:#10151f;border:1px solid #263247;border-radius:26px;padding:28px}.logo{font-weight:950;letter-spacing:.12em;color:#77d9ff}h1{font-size:34px;margin:18px 0 8px}.muted{color:#8e9aaf;line-height:1.5}label{display:block;margin-top:17px;font-size:12px;color:#aab4c5}input{width:100%;margin-top:7px;border:1px solid #2b374b;border-radius:14px;background:#0b1019;color:white;padding:14px;font:inherit;outline:none}button{width:100%;margin-top:18px;border:0;border-radius:14px;padding:14px;background:#f7f9ff;color:#071019;font-weight:850;font:inherit;cursor:pointer}.err{color:#ff9b9b;min-height:20px;margin-top:12px}.links{display:flex;justify-content:space-between;margin-top:18px}.links a{color:#77d9ff;text-decoration:none}</style></head><body><form class="card" id="form"><div class="logo">AI HUB · HOPE</div><h1>Welcome back.</h1><p class="muted">One account for HOPE, Academy, Projects, Models and your connected apps.</p><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign in</button><div class="err" id="err"></div><div class="links"><a href="/learn.html">Create account in Academy</a><a href="/">Home</a></div></form><script>const next=new URLSearchParams(location.search).get('next')||'/hope.html';fetch('/api/account/me',{cache:'no-store'}).then(r=>r.json()).then(x=>{if(x.authenticated)location.replace(next)});form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;err.textContent='';try{const r=await fetch('/api/account/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),j=await r.json();if(!r.ok)throw Error(j.error||'Sign in failed');location.replace(next)}catch(x){err.textContent=x.message;submit.disabled=false}}</script></body></html>
