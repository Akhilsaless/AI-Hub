<!doctype html><html data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>HOPE Attention Inbox</title><style>*{box-sizing:border-box}html{--bg:#080b12;--p:#10151f;--p2:#151c28;--t:#f7f9ff;--m:#8e9aaf;--l:#263247;--good:#58d39b;--warn:#f5c451;--bad:#ff8191;color-scheme:dark}html[data-theme=day]{--bg:#f4f8ff;--p:#fff;--p2:#edf4ff;--t:#111827;--m:#697386;--l:#d5e2ef;color-scheme:light}body{margin:0;background:var(--bg);color:var(--t);font:15px Inter,system-ui,sans-serif}.app{max-width:980px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:8;padding:12px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(22px);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:10px}.btn,.chip{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:13px;padding:10px 12px;text-decoration:none;cursor:pointer}.brand{font-weight:900}.sub{font-size:12px;color:var(--m)}.wrap{padding:20px 14px 70px}.hero{padding:24px;border:1px solid var(--l);border-radius:22px;background:linear-gradient(145deg,var(--p),var(--p2));margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px)}.hero p{margin:0;color:var(--m);line-height:1.55}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip.active{background:var(--t);color:var(--bg)}.items{display:grid;gap:12px}.item{border:1px solid var(--l);background:var(--p);border-radius:20px;padding:16px}.item.unread{box-shadow:inset 4px 0 0 var(--warn)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row h3{margin:0;flex:1}.pill{border:1px solid var(--l);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--m)}.approval{border-color:var(--warn);color:var(--warn)}.failed{border-color:var(--bad);color:var(--bad)}.completed{border-color:var(--good);color:var(--good)}.body{margin-top:10px;color:var(--m);white-space:pre-wrap;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:36px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:18px}.count{margin-left:auto;border-radius:999px;background:var(--warn);color:#17120a;font-weight:900;padding:5px 9px}@media(max-width:620px){.hero{padding:19px}.actions .btn{flex:1}}</style></head><body><main class="app"><header class="top"><a class="btn" href="/hope">← HOPE</a><div><div class="brand">Attention Inbox</div><div class="sub">What HOPE found while working for you</div></div><span class="count" id="count">0</span></header><section class="wrap"><div class="hero"><h1>Only what needs your attention.</h1><p>Approvals, completed missions, blocked work and failures appear here. HOPE keeps background work separate from normal chat so important items are easy to review.</p></div><div class="filters"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="unread">Unread</button><button class="chip" data-filter="approval_required">Approvals</button><button class="chip" data-filter="mission_completed">Completed</button><button class="chip" data-filter="mission_failed">Problems</button></div><div id="items" class="items"><div class="empty">Loading attention items…</div></div></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let filter='all';async function api(u,o={}){const r=await fetch(u,{cache:'no-store',credentials:'include',headers:{'content-type':'application/json',...(o.headers||{})},...o}),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/login.html?next='+encodeURIComponent(location.pathname);throw Error('Sign in required')}if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}function cls(t){if(t==='approval_required')return'approval';if(t==='mission_failed'||t==='mission_blocked')return'failed';if(t==='mission_completed')return'completed';return''}function label(t){return({approval_required:'Approval needed',mission_completed:'Completed',mission_failed:'Failed',mission_blocked:'Needs attention'}[t]||t.replaceAll('_',' '))}function actions(x){let a='';if(x.type==='approval_required'&&x.mission_id)a+=`<a class="btn" href="/hope-missions.html#${encodeURIComponent(x.mission_id)}">Review mission</a>`;if(x.type==='mission_blocked')a+=`<a class="btn" href="/connectors.html">Check connections</a>`;if(x.status==='unread')a+=`<button class="btn" onclick="mark('${x.id}','read')">Mark read</button>`;if(!['resolved','dismissed'].includes(x.status))a+=`<button class="btn" onclick="mark('${x.id}','resolved')">Resolve</button><button class="btn" onclick="mark('${x.id}','dismissed')">Dismiss</button>`;return a}function render(list){const shown=list.filter(x=>filter==='all'||filter==='unread'&&x.status==='unread'||x.type===filter);items.innerHTML=shown.length?shown.map(x=>`<article class="item ${x.status}"><div class="row"><h3>${esc(x.title)}</h3><span class="pill ${cls(x.type)}">${esc(label(x.type))}</span><span class="pill">${esc(x.status)}</span></div><div class="body">${esc(x.body||'')}</div><div class="sub" style="margin-top:9px">${esc(new Date(x.created_at).toLocaleString())}</div><div class="actions">${actions(x)}</div></article>`).join(''):'<div class="empty">Nothing here right now.</div>'}async function load(){try{const j=await api('/api/user/hope/inbox');count.textContent=j.unread||0;window.currentItems=j.items||[];render(window.currentItems)}catch(e){items.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}async function mark(id,status){await api('/api/user/hope/inbox',{method:'PATCH',body:JSON.stringify({id,status})});await load()}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render(window.currentItems||[])});load();setInterval(load,30000)</script></body></html>
