<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy · AI Hub</title><link rel="stylesheet" href="/hub-themes.css"><style>*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:22px}.top,.skillrow{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:20px}.nav,.stats{display:flex;gap:10px;flex-wrap:wrap}.pill,.btn{border:1px solid var(--hub-line);background:var(--hub-panel);color:var(--hub-text);border-radius:999px;padding:10px 14px;cursor:pointer}.hero{margin-top:24px;padding:32px;border:1px solid var(--hub-line);border-radius:28px;background:color-mix(in srgb,var(--hub-panel) 91%,transparent)}h1{font-size:clamp(34px,6vw,72px);line-height:.95;margin:12px 0;max-width:850px}.grad,.xp{color:var(--hub-accent)}.xp{font-weight:800}.sub{color:var(--hub-muted);font-size:17px;max-width:760px;line-height:1.6}.stats{margin-top:24px}.stat,.card{background:color-mix(in srgb,var(--hub-panel) 94%,transparent);border:1px solid var(--hub-line);border-radius:22px;padding:20px}.stat{padding:14px 18px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}.mission{box-shadow:inset 0 0 60px color-mix(in srgb,var(--hub-accent) 12%,transparent)}.tracks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.track{padding:18px;border-radius:18px;background:var(--hub-panel);border:1px solid var(--hub-line)}.track h3{margin:8px 0 5px}.meta{color:var(--hub-muted);font-size:12px}.bar{height:7px;background:var(--hub-line);border-radius:9px;overflow:hidden;margin-top:12px}.fill{height:100%;background:var(--hub-accent)}.skill{margin:15px 0}.login{max-width:430px;margin:80px auto}.login input{width:100%;padding:14px;margin:6px 0;background:var(--hub-panel);border:1px solid var(--hub-line);border-radius:12px;color:var(--hub-text)}.primary{background:var(--hub-accent);color:var(--hub-bg);font-weight:800}.lesson{position:fixed;inset:0;background:color-mix(in srgb,var(--hub-bg) 92%,transparent);display:none;z-index:5;overflow:auto}.lesson.open{display:block}.lessonbox{max-width:820px;margin:40px auto;padding:28px;background:var(--hub-panel);border:1px solid var(--hub-line);border-radius:24px}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:12px;border:1px solid var(--hub-line);background:var(--hub-panel);color:var(--hub-text);cursor:pointer}.league{font-size:12px;color:var(--hub-accent);font-weight:900}.mastery{font-size:34px;font-weight:900}@media(max-width:800px){.grid,.tracks{grid-template-columns:1fr}.wrap{padding:14px}.hero{padding:22px}.nav .hide{display:none}}</style><script src="/theme-runtime.js"></script></head><body><div class="wrap"><div class="top"><a class="brand" href="/">AI HUB · ACADEMY</a><div class="nav"><a class="pill hide" href="/arena.html">Proof Arena</a><a class="pill hide" href="/hope.html">HOPE</a><button class="pill" onclick="HubTheme.next()">World ◐</button><button class="pill" id="account">Account</button></div></div><div id="app"><div class="card login"><h2>Enter Academy</h2><p class="sub">Progress, mastery, proof and certificates follow your account.</p><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><button class="btn primary" style="width:100%;margin-top:8px" onclick="auth('signup')">Create free account</button><button class="btn" style="width:100%;margin-top:8px" onclick="auth('login')">I already have an account</button><p id="err" class="meta"></p></div></div></div><div class="lesson" id="lesson"><div class="lessonbox"><button class="pill" onclick="closeLesson()">← Back</button><div id="lessonContent"></div></div></div><script src="/academy-v2.js"></script><script src="/academy-missions.js"></script><script src="/academy-specialists.js"></script><script>let state=null,$=s=>document.querySelector(s);async function api(u,o){const r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function boot(){const me=await api('/api/account/me');if(me.authenticated){state=await api('/api/academy/state');render();await window.academyEnhance(state);await window.academyMissionsRender();await window.academyLoadSpecialists()}}async function auth(type){try{await api('/api/account/'+type,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value,name:$('#name').value||'Learner'})});await boot()}catch(e){$('#err').textContent=e.message}}function render(){const p=state.profile,r=state.retention,q=r.quest;$('#app').innerHTML=`<section class="hero"><div class="league">${r.league.toUpperCase()} LEAGUE · LEVEL ${p.level}</div><h1>Learn AI by <span class="grad">using it.</span></h1><p class="sub">Core mastery first. Then specialize for your career, business or creator goals.</p><div class="stats"><div class="stat"><b>🔥 ${p.streak}</b><span class="meta">streak</span></div><div class="stat"><b>${p.xp}</b><span class="meta">XP</span></div><div class="stat"><b>${r.mastery}%</b><span class="meta">mastery</span></div><div class="stat"><b>${p.completedLessons}/${p.totalLessons}</b><span class="meta">activities</span></div></div></section><div class="grid"><div><div class="card mission"><div class="xp">NEXT ADAPTIVE QUEST · +${q.reward} XP</div><h2>${q.title}</h2><p>${q.description}</p><button class="btn primary" onclick="window.academyPlay('${q.lessonId}')">Continue →</button></div><h2>Core learning worlds</h2><div class="tracks">${state.tracks.map(t=>`<div class="track"><div class="meta">${t.level} · ${t.completed}/${t.total}</div><h3>${t.icon} ${t.title}</h3><p class="meta">${t.desc}</p><button class="btn" onclick="openTrack('${t.id}')">Open →</button><div class="bar"><div class="fill" style="width:${t.total?100*t.completed/t.total:0}%"></div></div></div>`).join('')}</div></div><aside><div class="card"><div class="xp">SKILL PASSPORT</div><div class="mastery">${r.mastery}%</div>${Object.entries(p.skills||{}).map(([k,v])=>`<div class="skill"><div class="skillrow"><span>${k}</span><b>${v}</b></div><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`).join('')}<a class="btn" href="/arena.html">Proof Arena →</a></div></aside></div><div id="academyMissions"></div><section id="specialistAcademies" class="card" style="margin-top:18px">Loading specialist academies…</section>`}function openTrack(id){const t=state.tracks.find(x=>x.id===id);$('#lesson').classList.add('open');$('#lessonContent').innerHTML=`<h1 style="font-size:40px">${t.icon} ${t.title}</h1><p class="sub">${t.desc}</p>${t.lessons.map((l,i)=>`<button class="choice" ${l.unlocked?'':`disabled style="opacity:.5"`} onclick="${l.unlocked?`window.academyPlay('${l.id}')`:''}"><b>${l.completed?'✓':l.unlocked?'○':'🔒'} ${i+1}. ${l.title}</b><br><span class="meta">${l.format.toUpperCase()} ${l.score?'· BEST '+l.score:''}</span></button>`).join('')}`}function closeLesson(){speechSynthesis?.cancel?.();$('#lesson').classList.remove('open')}$('#account').onclick=async()=>{await api('/api/account/me',{method:'DELETE'});location.reload()};boot().catch(e=>{const el=$('#err');if(el)el.textContent=e.message});</script></body></html>
