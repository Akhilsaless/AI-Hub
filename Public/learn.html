<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learn · AI Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#070914;color:#f7f7fb;font:15px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:10px}.pill,.btn{border:1px solid #292d43;background:#121628;color:#fff;border-radius:999px;padding:10px 14px}.hero{margin-top:24px;padding:32px;border:1px solid #282d48;border-radius:28px;background:radial-gradient(circle at 80% 10%,#4c1d9566,transparent 35%),linear-gradient(145deg,#13162a,#0b0d19)}h1{font-size:clamp(34px,6vw,72px);line-height:.95;margin:12px 0;max-width:850px}.grad{background:linear-gradient(90deg,#8b5cf6,#22d3ee,#f472b6);-webkit-background-clip:text;color:transparent}.sub{color:#aeb5cb;font-size:17px;max-width:700px;line-height:1.6}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.stat{background:#0c1020;border:1px solid #252a40;padding:14px 18px;border-radius:16px}.stat b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}.card{background:#0e1120;border:1px solid #242940;border-radius:22px;padding:20px}.mission{background:linear-gradient(135deg,#24114b,#101c39)}.mission h2{margin:6px 0}.xp{color:#fbbf24;font-weight:800}.tracks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.track{padding:18px;border-radius:18px;background:#111528;border:1px solid #262b43;cursor:pointer;transition:.2s}.track:hover{transform:translateY(-3px);border-color:#7c3aed}.track .icon{font-size:28px}.track h3{margin:8px 0 5px}.meta{color:#929ab2;font-size:12px}.bar{height:7px;background:#23283b;border-radius:9px;overflow:hidden;margin-top:12px}.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#22d3ee)}.formats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;background:#1b2035;padding:5px 7px;border-radius:7px;color:#bec5db}.passport .skill{margin:15px 0}.skillrow{display:flex;justify-content:space-between}.login{max-width:430px;margin:80px auto}.login input{width:100%;padding:14px;margin:6px 0;background:#101426;border:1px solid #2b3047;border-radius:12px;color:#fff}.primary{background:linear-gradient(90deg,#7c3aed,#2563eb);border:0;font-weight:800;cursor:pointer}.lesson{position:fixed;inset:0;background:#070914ee;display:none;z-index:5;overflow:auto}.lesson.open{display:block}.lessonbox{max-width:760px;margin:50px auto;padding:28px;background:#101425;border:1px solid #303652;border-radius:24px}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:12px;border:1px solid #2c324c;background:#151a2e;color:#fff;cursor:pointer}@media(max-width:800px){.grid,.tracks{grid-template-columns:1fr}.wrap{padding:14px}.hero{padding:22px}.nav .hide{display:none}}</style></head><body><div class="wrap"><div class="top"><a class="brand" href="/">AI HUB <span style="color:#8b5cf6">LEARN</span></a><div class="nav"><a class="pill hide" href="/hope.html">Ask HOPE</a><a class="pill hide" href="/models.html">Models</a><button class="pill" id="account">Account</button></div></div><div id="app"><div class="card login"><h2>Enter the AI Arena</h2><p class="sub">Your progress, streak, XP and Skill Passport follow you.</p><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><button class="btn primary" style="width:100%;margin-top:8px" onclick="auth('signup')">Create free account</button><button class="btn" style="width:100%;margin-top:8px" onclick="auth('login')">I already have an account</button><p id="err" class="meta"></p></div></div></div><div class="lesson" id="lesson"><div class="lessonbox"><button class="pill" onclick="closeLesson()">← Back</button><div id="lessonContent"></div></div></div><script>
let state=null;const $=s=>document.querySelector(s);async function api(u,o){const r=await fetch(u,o);const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function boot(){const me=await api('/api/account/me');if(me.authenticated){state=await api('/api/academy/state');render()}else renderLogin()}function renderLogin(){}async function auth(type){try{const body={email:$('#email').value,password:$('#password').value,name:$('#name').value||'Learner'};await api('/api/account/'+type,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});await boot()}catch(e){$('#err').textContent=e.message}}function render(){const p=state.profile,m=state.dailyMission;$('#app').innerHTML=`<section class="hero"><div class="xp">LEVEL ${p.level} · ${p.xp} XP</div><h1>Don't study AI.<br><span class="grad">Play with it.</span></h1><p class="sub">Short stories. Model battles. Real missions. Build challenges. HOPE teaches when you're stuck — then makes you prove you can actually do it.</p><div class="stats"><div class="stat"><b>🔥 ${p.streak}</b><span class="meta">day streak</span></div><div class="stat"><b>${p.completedLessons}/${p.totalLessons}</b><span class="meta">challenges cleared</span></div><div class="stat"><b>${p.level}</b><span class="meta">AI level</span></div></div></section><div class="grid"><div><div class="card mission"><div class="xp">TODAY'S MISSION · +${m.xp} XP</div><h2>${m.title}</h2><p>${m.description}</p><button class="btn primary" onclick="mission()">Start 5-minute mission →</button></div><h2>Your worlds</h2><div class="tracks">${state.tracks.map(t=>`<div class="track" onclick="openTrack('${t.id}')"><div class="icon">${t.icon}</div><div class="meta">${t.level} · ${t.completed}/${t.total}</div><h3>${t.title}</h3><div class="meta">${t.desc}</div><div class="bar"><div class="fill" style="width:${t.total?100*t.completed/t.total:0}%"></div></div><div class="formats">${[...new Set(t.lessons.map(x=>x.format))].map(x=>`<span class="tag">${x.toUpperCase()}</span>`).join('')}</div></div>`).join('')}</div></div><aside><div class="card passport"><div class="xp">AI SKILL PASSPORT</div><h2>Prove what you can do.</h2><p class="meta">Scores grow from challenges, not hours watched.</p>${['Prompting','Research','Models','Automation','Agents','Building'].map((x,i)=>`<div class="skill"><div class="skillrow"><span>${x}</span><b>${Math.min(99,10+p.level*6+i*2)}</b></div><div class="bar"><div class="fill" style="width:${Math.min(99,10+p.level*6+i*2)}%"></div></div></div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="xp">HOPE TUTOR</div><h3>Stuck? Don't quit.</h3><p class="meta">Ask HOPE to explain any lesson normally, happily, angrily or ridiculously funny.</p><a class="btn" href="/hope.html">Ask HOPE →</a></div></aside></div>`}function openTrack(id){const t=state.tracks.find(x=>x.id===id);$('#lesson').classList.add('open');$('#lessonContent').innerHTML=`<h1 style="font-size:40px">${t.icon} ${t.title}</h1><p class="sub">${t.desc}</p>${t.lessons.map((l,i)=>`<button class="choice" onclick="play('${l.id}','${l.title.replaceAll("'","&#39;")}')"><b>${l.completed?'✓':'○'} ${i+1}. ${l.title}</b><br><span class="meta">${l.format.toUpperCase()} · 3–8 MIN</span></button>`).join('')}`}function play(id,title){$('#lessonContent').innerHTML=`<div class="xp">MICRO CHALLENGE</div><h1 style="font-size:42px">${title}</h1><p class="sub">No 40-minute lecture. Learn the idea, use it immediately, then beat the challenge.</p><div class="card"><h3>⚡ The 60-second idea</h3><p>HOPE presents this concept as a short visual story with a practical example. The full lesson-content engine plugs into this challenge shell.</p></div><div class="card" style="margin-top:12px"><h3>🎯 Prove it</h3><p>Which approach best shows real understanding instead of memorization?</p><button class="choice" onclick="finish('${id}',45)">Repeat the definition word-for-word</button><button class="choice" onclick="finish('${id}',95)">Apply the idea to a new real-world problem</button><button class="choice" onclick="finish('${id}',55)">Watch the lesson again without trying it</button></div>`}async function finish(id,score){const r=await api('/api/academy/complete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({lessonId:id,score})});if(r.passed){alert(`⚡ CLEARED! +${r.earned} XP · Streak ${r.streak} 🔥`);closeLesson();state=await api('/api/academy/state');render()}else alert(r.message)}function mission(){alert('Daily missions will use HOPE-generated real-world challenges. Mission shell is active; adaptive generation is the next content layer.')}function closeLesson(){$('#lesson').classList.remove('open')}$('#account').onclick=async()=>{await api('/api/account/me',{method:'DELETE'});location.reload()};boot().catch(e=>{$('#err').textContent=e.message});</script></body></html>
