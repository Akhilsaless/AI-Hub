<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learn · AI Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#070914;color:#f7f7fb;font:15px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:10px}.pill,.btn{border:1px solid #292d43;background:#121628;color:#fff;border-radius:999px;padding:10px 14px;cursor:pointer}.hero{margin-top:24px;padding:32px;border:1px solid #282d48;border-radius:28px;background:radial-gradient(circle at 80% 10%,#4c1d9566,transparent 35%),linear-gradient(145deg,#13162a,#0b0d19)}h1{font-size:clamp(34px,6vw,72px);line-height:.95;margin:12px 0;max-width:850px}.grad{background:linear-gradient(90deg,#8b5cf6,#22d3ee,#f472b6);-webkit-background-clip:text;color:transparent}.sub{color:#aeb5cb;font-size:17px;max-width:700px;line-height:1.6}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.stat{background:#0c1020;border:1px solid #252a40;padding:14px 18px;border-radius:16px}.stat b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}.card{background:#0e1120;border:1px solid #242940;border-radius:22px;padding:20px}.mission{background:linear-gradient(135deg,#24114b,#101c39)}.xp{color:#fbbf24;font-weight:800}.tracks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.track{padding:18px;border-radius:18px;background:#111528;border:1px solid #262b43;cursor:pointer;transition:.2s}.track:hover{transform:translateY(-3px);border-color:#7c3aed}.track .icon{font-size:28px}.track h3{margin:8px 0 5px}.meta{color:#929ab2;font-size:12px}.bar{height:7px;background:#23283b;border-radius:9px;overflow:hidden;margin-top:12px}.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#22d3ee)}.formats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;background:#1b2035;padding:5px 7px;border-radius:7px;color:#bec5db}.passport .skill{margin:15px 0}.skillrow{display:flex;justify-content:space-between}.login{max-width:430px;margin:80px auto}.login input{width:100%;padding:14px;margin:6px 0;background:#101426;border:1px solid #2b3047;border-radius:12px;color:#fff}.primary{background:linear-gradient(90deg,#7c3aed,#2563eb);border:0;font-weight:800}.lesson{position:fixed;inset:0;background:#070914ee;display:none;z-index:5;overflow:auto}.lesson.open{display:block}.lessonbox{max-width:760px;margin:50px auto;padding:28px;background:#101425;border:1px solid #303652;border-radius:24px}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:12px;border:1px solid #2c324c;background:#151a2e;color:#fff;cursor:pointer}.quest{border-color:#7c3aed}.league{font-size:12px;color:#22d3ee;font-weight:900;letter-spacing:.08em}.mastery{font-size:34px;font-weight:900}@media(max-width:800px){.grid,.tracks{grid-template-columns:1fr}.wrap{padding:14px}.hero{padding:22px}.nav .hide{display:none}}</style></head><body><div class="wrap"><div class="top"><a class="brand" href="/">AI HUB <span style="color:#8b5cf6">LEARN</span></a><div class="nav"><a class="pill hide" href="/arena.html">Proof Arena</a><a class="pill hide" href="/hope.html">Ask HOPE</a><a class="pill hide" href="/models.html">Models</a><button class="pill" id="account">Account</button></div></div><div id="app"><div class="card login"><h2>Enter the AI Arena</h2><p class="sub">Your progress, streak, XP and Skill Passport follow you.</p><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><button class="btn primary" style="width:100%;margin-top:8px" onclick="auth('signup')">Create free account</button><button class="btn" style="width:100%;margin-top:8px" onclick="auth('login')">I already have an account</button><p id="err" class="meta"></p></div></div></div><div class="lesson" id="lesson"><div class="lessonbox"><button class="pill" onclick="closeLesson()">← Back</button><div id="lessonContent"></div></div></div><script>let state=null,$=s=>document.querySelector(s);async function api(u,o){const r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function boot(){const me=await api('/api/account/me');if(me.authenticated){state=await api('/api/academy/state');render()}}async function auth(type){try{await api('/api/account/'+type,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value,name:$('#name').value||'Learner'})});await boot()}catch(e){$('#err').textContent=e.message}}function render(){const p=state.profile,m=state.dailyMission,r=state.retention,q=r.quest;$('#app').innerHTML=`<section class="hero"><div class="league">${r.league.toUpperCase()} LEAGUE · LEVEL ${p.level}</div><h1>Don't study AI.<br><span class="grad">Play with it.</span></h1><p class="sub">Short stories, adaptive challenges and real proof missions. Learn it, use it, then prove you can do it.</p><div class="stats"><div class="stat"><b>🔥 ${p.streak}</b><span class="meta">day streak</span></div><div class="stat"><b>${p.xp}</b><span class="meta">total XP</span></div><div class="stat"><b>${r.mastery}%</b><span class="meta">mastery</span></div><div class="stat"><b>${p.completedLessons}/${p.totalLessons}</b><span class="meta">cleared</span></div></div></section><div class="grid"><div><div class="card mission quest"><div class="xp">YOUR NEXT QUEST · +${q.reward} XP</div><h2>${q.title}</h2><p>${q.description}</p><button class="btn primary" onclick="play('${q.lessonId}')">Continue quest →</button></div><div class="card mission" style="margin-top:14px"><div class="xp">PROOF ARENA</div><h2>Turn learning into evidence.</h2><p>Reasoning duels, prompt battles, research trials, agent rescue and real build missions strengthen your Skill Passport.</p><a class="btn primary" href="/arena.html">Enter Proof Arena →</a></div><h2>Your worlds</h2><div class="tracks">${state.tracks.map(t=>`<div class="track" onclick="openTrack('${t.id}')"><div class="icon">${t.icon}</div><div class="meta">${t.level} · ${t.completed}/${t.total}</div><h3>${t.title}</h3><div class="meta">${t.desc}</div><div class="bar"><div class="fill" style="width:${t.total?100*t.completed/t.total:0}%"></div></div><div class="formats">${[...new Set(t.lessons.map(x=>x.format))].map(x=>`<span class="tag">${x.toUpperCase()}</span>`).join('')}</div></div>`).join('')}</div></div><aside><div class="card passport"><div class="xp">AI SKILL PASSPORT</div><div class="mastery">${r.mastery}%</div><p class="meta">Scores improve from completed challenges and verified Proof Arena evidence.</p>${['Prompting','Research','Models','Automation','Agents','Building'].map((x,i)=>{const v=Number(p.skills?.[x.toLowerCase()]||0);return `<div class="skill"><div class="skillrow"><span>${x}</span><b>${v}</b></div><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`}).join('')}<a class="btn" href="/arena.html">Earn verified proof →</a></div><div class="card" style="margin-top:14px"><div class="xp">HOPE TUTOR</div><h3>Stuck? Change the explanation.</h3><p class="meta">HOPE remains a universal assistant outside Academy.</p><a class="btn" href="/hope.html">Ask HOPE →</a></div></aside></div>`}function openTrack(id){const t=state.tracks.find(x=>x.id===id);$('#lesson').classList.add('open');$('#lessonContent').innerHTML=`<h1 style="font-size:40px">${t.icon} ${t.title}</h1><p class="sub">${t.desc}</p>${t.lessons.map((l,i)=>`<button class="choice" onclick="play('${l.id}')"><b>${l.completed?'✓':'○'} ${i+1}. ${l.title}</b><br><span class="meta">${l.format.toUpperCase()} · ${l.score?`BEST ${l.score} · `:''}3–8 MIN</span></button>`).join('')}`}async function play(id){$('#lesson').classList.add('open');const {challenge:c}=await api('/api/academy/challenge?lessonId='+encodeURIComponent(id));$('#lessonContent').innerHTML=`<div class="xp">${c.label.toUpperCase()} · ${c.difficulty.toUpperCase()}</div><h1 style="font-size:42px">${c.lesson.title}</h1><p class="sub">${c.instruction}</p><div class="card"><h3>⚡ 60-second idea</h3><p>Understand it through a practical example, then use it immediately.</p></div><div class="card" style="margin-top:12px"><h3>🎯 Prove it</h3><button class="choice" onclick="finish('${id}',45)">Repeat the definition without applying it</button><button class="choice" onclick="finish('${id}',95)">Apply it, explain the trade-off and verify the result</button><button class="choice" onclick="finish('${id}',58)">Choose an answer without explaining why</button></div>`}async function finish(id,score){const r=await api('/api/academy/complete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({lessonId:id,score})});if(r.passed){$('#lessonContent').innerHTML=`<div class="xp">⚡ CLEARED</div><h1>+${r.earned} XP</h1><p class="sub">Required ${r.requiredScore} · scored ${r.score}. Your next step is to prove skills in a real mission.</p><a class="btn primary" href="/arena.html">Try Proof Arena →</a> <button class="btn" onclick="afterWin()">Keep learning</button>`}else $('#lessonContent').innerHTML=`<div class="xp">HOPE COACH MODE</div><h2>Fresh explanation. New attempt.</h2><p class="sub">You scored ${r.score}; this difficulty needs ${r.requiredScore}. Change the explanation instead of replaying a lecture.</p><a class="btn" href="/hope.html">Explain with HOPE →</a> <button class="btn primary" onclick="play('${id}')">Retry</button>`}async function afterWin(){closeLesson();state=await api('/api/academy/state');render()}function closeLesson(){$('#lesson').classList.remove('open')}$('#account').onclick=async()=>{await api('/api/account/me',{method:'DELETE'});location.reload()};boot().catch(e=>{const el=$('#err');if(el)el.textContent=e.message});</script></body></html>
