<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOPE Missions</title><link rel="stylesheet" href="/hope-3d.css"><style>body{margin:0;background:#05070d;color:#eef2ff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.muted{color:#99a3ba}.panel,.mission{background:rgba(16,20,33,.82);border:1px solid #29324a;border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 18px 55px #0007}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}input,textarea,select,button{box-sizing:border-box;width:100%;border-radius:13px;border:1px solid #303b58;background:#0b1020;color:#fff;padding:12px;font:inherit}textarea{min-height:90px}button{cursor:pointer;background:#dfe7ff;color:#0b1020;font-weight:800}.row{display:flex;gap:9px;flex-wrap:wrap}.row button{width:auto}.pill{display:inline-block;border:1px solid #3a4667;border-radius:99px;padding:5px 9px;font-size:12px}.approval{border-color:#ffcc66;color:#ffdc91}.good{border-color:#64d9a0;color:#91efbc}.bad{border-color:#ff7c8e;color:#ffabb6}.mission h3{margin:8px 0}.meta{font-size:13px;color:#9ca8c1}.block{margin-top:12px;padding:13px;border-radius:14px;background:#151522;border:1px solid #564629}.empty{text-align:center;padding:45px;color:#9aa5bd}.approve{background:#9bf0c2}.reject{background:#ffb1bc}.edit{background:#ffe0a3}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><div class="pill">HOPE 6.1 · AUTONOMOUS MISSIONS</div><h1>Mission Control</h1><div class="muted">HOPE works in the background. Protected external actions stay paused until you decide.</div></div><a href="/hope-jobs.html" class="muted">Jobs →</a></div><section class="panel"><h2>Create mission</h2><div class="grid"><div><textarea id="objective" placeholder="Example: Every morning check Gmail for important client replies and summarize what needs my attention."></textarea></div><div><input id="title" placeholder="Mission name"><input id="schedule" style="margin-top:9px" placeholder="Schedule, e.g. daily 08:00"><select id="approval" style="margin-top:9px"><option value="writes">Auto-run safe work; approve writes</option><option value="all">Ask before protected actions</option></select></div></div><button id="create" style="margin-top:12px">Create autonomous mission</button><div id="msg" class="meta" style="margin-top:9px"></div></section><section><div class="top" style="margin-top:28px"><h2>Your missions</h2><button id="refresh" style="width:auto">Refresh</button></div><div id="missions"><div class="empty">Loading missions…</div></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}
function statusClass(s){return s==='active'||s==='completed'?'good':s==='awaiting_confirmation'?'approval':s==='failed'?'bad':''}
function approvalControls(m,block){if(m.status!=='awaiting_confirmation'||!block?.stepId)return '';return `<div class="row" style="margin-top:12px"><button class="approve" onclick="decide('${m.id}','approve')">Approve & continue</button><button class="edit" onclick="editAction('${m.id}')">Edit action</button><button class="reject" onclick="decide('${m.id}','reject')">Reject</button></div>`}
function render(m){const last=m.lastResult||{},block=last.block;return `<article class="mission"><span class="pill ${statusClass(m.status)}">${esc(m.status)}</span><h3>${esc(m.title)}</h3><div>${esc(m.objective)}</div><div class="meta" style="margin-top:9px">${esc(m.recurrence||m.schedule)} · Next: ${esc(m.nextRunAt||'—')} · Runs: ${m.runCount||0} · Failures: ${m.failureCount||0}</div>${block?`<div class="block"><b>HOPE needs your decision</b><div class="meta">${esc(block.action||block.connector||block.type||'Action paused')}</div>${block.preview?`<pre style="white-space:pre-wrap">${esc(JSON.stringify(block.preview,null,2))}</pre>`:''}${approvalControls(m,block)}</div>`:''}<div class="row" style="margin-top:12px"><button onclick="toggle('${m.id}',${!m.enabled})">${m.enabled?'Pause':'Resume'}</button><button onclick="removeMission('${m.id}')">Delete</button></div></article>`}
async function load(){try{const j=await api('/api/user/hope/missions');window._missions=j.missions||[];$('missions').innerHTML=j.missions?.length?j.missions.map(render).join(''):'<div class="empty">No missions yet. Create the first one above.</div>'}catch(e){$('missions').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$('create').onclick=async()=>{try{$('msg').textContent='Creating…';await api('/api/user/hope/missions',{method:'POST',body:JSON.stringify({objective:$('objective').value,title:$('title').value,schedule:$('schedule').value,approvalMode:$('approval').value})});$('msg').textContent='Mission created.';$('objective').value='';$('title').value='';await load()}catch(e){$('msg').textContent=e.message}};
async function decide(missionId,decision,payload){try{await api('/api/user/hope/mission-decision',{method:'POST',body:JSON.stringify({missionId,decision,payload})});await load()}catch(e){alert(e.message)}}
async function editAction(id){const m=(window._missions||[]).find(x=>x.id===id),preview=m?.lastResult?.block?.preview||{};const raw=prompt('Edit the action payload as JSON:',JSON.stringify(preview,null,2));if(raw===null)return;let payload;try{payload=JSON.parse(raw)}catch{return alert('Invalid JSON. Nothing was changed.')}if(!confirm('Run this edited protected action?'))return;await decide(id,'edit',payload)}
async function toggle(id,enabled){await api('/api/user/hope/missions',{method:'PATCH',body:JSON.stringify({id,enabled})});load()}async function removeMission(id){if(!confirm('Delete this mission?'))return;await api('/api/user/hope/missions?id='+encodeURIComponent(id),{method:'DELETE'});load()}$('refresh').onclick=load;load();setInterval(load,30000);
</script></body></html>
