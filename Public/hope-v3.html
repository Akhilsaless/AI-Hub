<!doctype html><html data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>HOPE · AI Hub</title><style>*{box-sizing:border-box}html{--bg:#080b12;--p:#10151f;--p2:#151c28;--t:#f7f9ff;--m:#8e9aaf;--l:#263247;--u:#edf8ff;--ut:#071019;color-scheme:dark}html[data-theme=day]{--bg:#f4f8ff;--p:#fff;--p2:#edf4ff;--t:#111827;--m:#697386;--l:#d5e2ef;--u:#172033;--ut:#fff;color-scheme:light}body{margin:0;background:var(--bg);color:var(--t);font:15px Inter,system-ui,sans-serif}.app{max-width:980px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:8;padding:12px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(22px);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:10px}.round,.chip,.action,.suggest{border:1px solid var(--l);background:var(--p2);color:var(--t);cursor:pointer}.round{width:44px;height:44px;border-radius:50%;font-size:18px}.brand{font-weight:900;letter-spacing:.08em}.sub{font-size:12px;color:var(--m)}.admin{margin-left:auto;text-decoration:none;padding:9px 12px;border-radius:12px;background:#f5c451;color:#17120a;font-weight:850}.chat{padding:20px 14px 125px}.welcome{min-height:52vh;display:grid;place-items:center;text-align:center}.welcome h1{font-size:clamp(34px,7vw,58px);margin:0 0 9px}.welcome p{max-width:620px;color:var(--m);font-size:16px}.suggestions,.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.suggest,.action{padding:15px 12px;border-radius:16px;text-align:left}.action b{display:block}.action span{font-size:12px;color:var(--m)}.msg{max-width:84%;padding:12px 15px;border-radius:19px;margin:11px 0;white-space:pre-wrap;line-height:1.55}.user{margin-left:auto;background:var(--u);color:var(--ut)}.assistant{background:var(--p);border:1px solid var(--l)}.composerWrap{position:fixed;bottom:0;left:0;right:0;z-index:9;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}.picked{max-width:948px;margin:auto;color:var(--m);font-size:12px;padding:4px 10px}.composer{max-width:948px;margin:auto;display:flex;align-items:flex-end;gap:7px;padding:8px;border:1px solid var(--l);border-radius:27px;background:var(--p)}textarea{flex:1;min-height:44px;max-height:145px;resize:none;background:transparent;border:0;outline:0;color:var(--t);padding:11px 4px;font:inherit}.send{background:var(--t);color:var(--bg)}.drawer{position:fixed;z-index:30;inset:0 auto 0 0;width:min(370px,90vw);background:var(--p);border-right:1px solid var(--l);padding:16px;transform:translateX(-105%);transition:.2s;overflow:auto}.drawer.open{transform:none}.scrim{position:fixed;inset:0;background:#0008;z-index:29}.hidden{display:none!important}.section{margin:18px 7px 7px;color:var(--m);font-size:11px;text-transform:uppercase}.nav{width:100%;padding:11px 9px;border:0;background:transparent;color:var(--t);text-align:left;border-radius:11px}.thread{display:flex;gap:6px;align-items:center}.thread .nav{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tiny{border:0;background:transparent;color:var(--m);padding:7px}.sheet{position:fixed;z-index:40;left:12px;right:12px;bottom:12px;max-width:680px;max-height:82vh;overflow:auto;margin:auto;background:var(--p);border:1px solid var(--l);border-radius:24px;padding:17px}.chip{border-radius:999px;padding:9px 12px}.status{display:inline-block;margin:0 0 10px;padding:6px 10px;border:1px solid var(--l);border-radius:999px;color:var(--m)}@media(max-width:600px){.msg{max-width:94%}.suggestions,.grid{grid-template-columns:1fr}.admin{padding:8px 9px}}</style></head><body><main class="app"><header class="top"><button class="round" id="menu">☰</button><div><div class="brand">HOPE</div><div class="sub" id="state">Ready</div></div><a id="admin" class="admin hidden" href="/command-center.html">Admin</a><button class="round" id="theme">◐</button><button class="round" id="newChat">＋</button></header><section class="chat"><div id="welcome" class="welcome"><div><h1>Ask HOPE anything.</h1><p>Chat, research, files, learning and real actions through your connected apps.</p><div class="suggestions"><button class="suggest" onclick="seed('Research this for me: ')">🔎 Research something</button><button class="suggest" onclick="seed('Help me build or fix this: ')">🛠 Build or fix something</button><button class="suggest" onclick="seed('Explain this simply: ')">💡 Explain something</button><button class="suggest" onclick="openTools()">＋ Use HOPE tools</button></div></div></div><div id="messages"></div></section><div class="composerWrap"><div class="picked" id="picked"></div><div class="composer"><button class="round" id="plus">＋</button><textarea id="input" placeholder="Message HOPE…"></textarea><button class="round" id="voice">🔊</button><button class="round" id="mic">🎙</button><button class="round send" id="send">↑</button></div></div></main><input id="file" type="file" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.tsx,.jsx,.html,.css" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><div id="scrim" class="scrim hidden"></div><aside id="drawer" class="drawer"><button class="round" id="close">×</button><div class="section">HOPE</div><button class="nav" onclick="startNew();closeDrawer()">＋ New chat</button><div class="section">Recent chats</div><div id="history"></div><div class="section">Workspace</div><button class="nav" onclick="location.href='/account.html'">My Hub / Projects</button><button class="nav" onclick="location.href='/connectors.html'">Connected apps</button><button class="nav" onclick="location.href='/learn.html'">Academy</button><button class="nav" onclick="location.href='/models.html'">Models</button><button id="adminNav" class="nav hidden" onclick="location.href='/command-center.html'">Admin / Command Center</button></aside><div id="sheet" class="sheet hidden"></div><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let mood=localStorage.hopeMood||'normal',threadId='',threads=[],attachments=[],busy=false,voiceOn=localStorage.hopeVoice==='1';document.documentElement.dataset.theme=localStorage.hopeTheme||'night';const moodInfo={normal:['⚪ Normal','Balanced, natural and direct.'],happy:['😊 Happy','Warm, optimistic and energetic.'],funny:['😂 Very Funny','Playful, witty and actively funny.'],angry:['😤 Angry','Fiery, impatient energy without insults or abuse.']};function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)}function add(role,text){welcome.classList.add('hidden');messages.insertAdjacentHTML('beforeend',`<div class="msg ${role}">${esc(text)}</div>`);scrollTo(0,document.body.scrollHeight)}function seed(t){input.value=t;input.focus()}async function api(u,o){const r=await fetch(u,{cache:'no-store',...o}),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/login.html?next='+encodeURIComponent(location.pathname);throw Error('Sign in required')}if(!r.ok){const e=Error(j.error||`HTTP ${r.status}`);e.data=j;throw e}return j}async function boot(){voiceState();const me=await api('/api/account/me');if(me.user?.isOwner){admin.classList.remove('hidden');adminNav.classList.remove('hidden')}await refreshThreads();if(threads[0])await loadThread(threads[0].id);else startNew()}async function refreshThreads(){const d=await api('/api/user/hope/chat');threads=d.threads||[];history.innerHTML=threads.map(t=>`<div class="thread"><button class="nav" onclick="loadThread('${t.id}')">${esc(t.title)}</button><button class="tiny" onclick="renameThread('${t.id}','${esc(t.title)}')">✎</button><button class="tiny" onclick="deleteThread('${t.id}')">🗑</button></div>`).join('')||'<div class="sub">No chats yet.</div>'}async function loadThread(id){threadId=id;messages.innerHTML='';const d=await api('/api/user/hope/chat?thread='+encodeURIComponent(id));(d.messages||[]).forEach(x=>add(x.role==='user'?'user':'assistant',x.content));closeDrawer()}function startNew(){threadId=uuid();messages.innerHTML='';welcome.classList.remove('hidden');attachments=[];renderPicked();input.focus()}async function renameThread(id,current){const title=prompt('Rename conversation',current);if(!title)return;await api('/api/user/hope/chat',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({threadId:id,title})});refreshThreads()}async function deleteThread(id){if(!confirm('Delete this conversation? HOPE memory is kept.'))return;await api('/api/user/hope/chat?thread='+encodeURIComponent(id),{method:'DELETE'});if(threadId===id)startNew();refreshThreads()}function openTools(){sheet.classList.remove('hidden');scrim.classList.remove('hidden');sheet.innerHTML=`<h2>HOPE Actions</h2><div class="status">Mood: ${moodInfo[mood][0]}</div><div class="grid"><button class="action" onclick="file.click();closeSheet()"><b>📎 Files & images</b><span>Attach documents, screenshots or photos</span></button><button class="action" onclick="camera.click();closeSheet()"><b>📷 Camera</b><span>Take a photo and attach it</span></button><button class="action" onclick="seed('Research this for me: ');closeSheet()"><b>🔎 Research</b><span>Live research with sources</span></button><button class="action" onclick="openMood()"><b>🎭 Mood</b><span>Change how HOPE behaves</span></button><button class="action" onclick="openApps()"><b>🔌 Connected apps</b><span>Gmail, Calendar and GitHub actions</span></button><button class="action" onclick="location.href='/account.html'"><b>📁 Projects</b><span>Continue project workspaces</span></button><button class="action" onclick="location.href='/learn.html'"><b>⚡ Learn</b><span>Open AI Hub Academy</span></button></div><button class="chip" onclick="closeSheet()">Close</button>`}function openMood(){sheet.innerHTML=`<h2>Choose HOPE mood</h2><div class="grid">${Object.entries(moodInfo).map(([k,v])=>`<button class="action" onclick="setMood('${k}')"><b>${v[0]}${mood===k?' ✓':''}</b><span>${v[1]}</span></button>`).join('')}</div><button class="chip" onclick="openTools()">← Back</button>`}function setMood(m){mood=m;localStorage.hopeMood=m;closeSheet();const starts={happy:['Love that energy. 😊 Give me anything you want to work on and I’ll keep this upbeat.','Happy mode is on. Small win already: you just made your AI less boring. 😄'],funny:['Very Funny mode activated. 😂 My serious face has been placed in airplane mode. What are we doing?','Comedy settings: irresponsibly high. 😂 Give me a topic before I start making jokes about loading screens.'],angry:['Angry mode on. 😤 Give me the problem. We are not wasting time on nonsense.','Fiery mode activated. 😤 Point me at the problem and let’s deal with it.'],normal:['Normal mode on. What can I help with?']};const a=starts[m]||starts.normal;add('assistant',a[Math.floor(Math.random()*a.length)])}function openApps(){sheet.innerHTML=`<h2>Connected app actions</h2><div class="grid"><button class="action" onclick="runRead('gmail_search')"><b>📨 Search Gmail</b><span>Read-only search</span></button><button class="action" onclick="runWrite('gmail_draft')"><b>✍️ Draft email</b><span>Creates a Gmail draft after confirmation</span></button><button class="action" onclick="runWrite('gmail_send')"><b>📤 Send email</b><span>Sends only after confirmation</span></button><button class="action" onclick="runRead('calendar_read')"><b>📅 Read calendar</b><span>Show upcoming events</span></button><button class="action" onclick="runWrite('calendar_create')"><b>➕ Create event</b><span>Creates only after confirmation</span></button><button class="action" onclick="runRead('github_read')"><b>🐙 Read GitHub repo</b><span>Repository information</span></button><button class="action" onclick="runWrite('github_issue')"><b>📝 Create GitHub issue</b><span>Creates only after confirmation</span></button><button class="action" onclick="location.href='/api/user/connect/google/start'"><b>🔗 Connect Google</b><span>Gmail + Calendar OAuth</span></button><button class="action" onclick="location.href='/api/user/connect/github/start'"><b>🔗 Connect GitHub</b><span>GitHub OAuth</span></button></div><button class="chip" onclick="openTools()">← Back</button>`}async function runRead(a){try{let payload={};if(a==='gmail_search')payload={query:prompt('Search Gmail for:')||'',limit:10};if(a==='calendar_read')payload={limit:10};if(a==='github_read')payload={repo:prompt('Repository (owner/name):')||''};if((a==='gmail_search'||a==='github_read')&&!Object.values(payload)[0])return;closeSheet();state.textContent='Running action…';const d=await api('/api/user/hope/actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:a,payload})});add('assistant',`Action completed: ${a}\n${JSON.stringify(d.result,null,2).slice(0,5000)}`);state.textContent='Ready'}catch(e){if(e.data?.connectRequired){add('assistant',`Connect ${e.data.connector} first from + → Connected apps.`)}else add('assistant','Action failed: '+e.message);state.textContent='Ready'}}async function runWrite(a){let p={};if(a==='gmail_draft'||a==='gmail_send')p={to:prompt('To email:')||'',subject:prompt('Subject:')||'',body:prompt('Message:')||''};if(a==='calendar_create')p={summary:prompt('Event title:')||'',start:prompt('Start ISO date/time, e.g. 2026-08-14T10:00:00+05:30')||'',end:prompt('End ISO date/time:')||'',timeZone:'Asia/Kolkata'};if(a==='github_issue')p={repo:prompt('Repository owner/name:')||'',title:prompt('Issue title:')||'',body:prompt('Issue details:')||''};if(!confirm(`HOPE is about to perform ${a}. Continue?`))return;try{closeSheet();state.textContent='Executing…';const d=await api('/api/user/hope/actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:a,payload:p,confirm:true})});add('assistant',`Done. ${a} completed successfully.${d.result?.html_url?'\n'+d.result.html_url:''}`)}catch(e){add('assistant',e.data?.connectRequired?`Connect ${e.data.connector} first from + → Connected apps.`:'Action failed: '+e.message)}finally{state.textContent='Ready'}}function closeSheet(){sheet.classList.add('hidden');scrim.classList.add('hidden')}plus.onclick=openTools;scrim.onclick=()=>{closeSheet();closeDrawer()};function openDrawer(){drawer.classList.add('open');scrim.classList.remove('hidden')}function closeDrawer(){drawer.classList.remove('open');if(sheet.classList.contains('hidden'))scrim.classList.add('hidden')}menu.onclick=openDrawer;close.onclick=closeDrawer;newChat.onclick=startNew;theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='day'?'night':'day';localStorage.hopeTheme=document.documentElement.dataset.theme};function renderPicked(){picked.textContent=attachments.length?attachments.map(x=>x.name).join(' · '):''}function toB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||'').split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f)})}async function pickFiles(list){attachments=[];for(const f of [...list].slice(0,4)){if(f.size>6500000){alert(`${f.name} is too large.`);continue}const x={name:f.name,type:f.type||'application/octet-stream',size:f.size};if(f.size<500000&&(/^(text\/)/.test(x.type)||/\.(txt|md|csv|json|js|ts|tsx|jsx|html|css)$/i.test(f.name)))x.text=(await f.text()).slice(0,30000);else if(/^(image\/|application\/pdf$)/.test(x.type))x.data=await toB64(f);attachments.push(x)}renderPicked()}file.onchange=e=>pickFiles(e.target.files);camera.onchange=e=>pickFiles(e.target.files);function voiceState(){voice.style.outline=voiceOn?'2px solid #77d9ff':''}function speak(text){if(!voiceOn||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[*#`]/g,''));u.pitch=mood==='happy'?1.08:mood==='angry'?.92:1;speechSynthesis.speak(u)}voice.onclick=()=>{voiceOn=!voiceOn;localStorage.hopeVoice=voiceOn?'1':'0';voiceState()};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='en-IN';mic.onclick=()=>{state.textContent='Listening…';rec.start()};rec.onresult=e=>{input.value=e.results[0][0].transcript;state.textContent='Ready';sendMessage()};rec.onerror=()=>state.textContent='Microphone error'}else mic.onclick=()=>alert('Speech input is not supported in this browser.');async function sendMessage(){const raw=input.value.trim();if((!raw&&!attachments.length)||busy)return;busy=true;input.value='';add('user',raw||`Attached: ${attachments.map(x=>x.name).join(', ')}`);state.textContent='Thinking…';const moodBoost={funny:' Be actively witty and genuinely funny throughout this reply; open with a humorous line when appropriate.',happy:' Open warmly and keep the reply noticeably upbeat and encouraging.',angry:' Use noticeably fiery, impatient, high-energy wording while remaining respectful and safe.',normal:''}[mood];try{const d=await api('/api/user/hope/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({threadId,message:raw+(moodBoost?`\n\n[HOPE MOOD INSTRUCTION:${moodBoost}]`:''),mood,attachments})});threadId=d.threadId||threadId;add('assistant',d.text||'');speak(d.text||'');attachments=[];renderPicked();refreshThreads()}catch(e){add('assistant','Error: '+e.message)}finally{state.textContent='Ready';busy=false}}send.onclick=sendMessage;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});boot().catch(e=>state.textContent=e.message)</script></body></html>
