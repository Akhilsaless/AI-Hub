<!doctype html><html data-theme="ai-night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Providers · HOPE</title><link rel="stylesheet" href="/hub-themes.css"><script src="/theme-runtime.js"></script><style>*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui}.wrap{max-width:1220px;margin:auto;padding:22px}.top,.row,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top b{margin-right:auto}.card{background:color-mix(in srgb,var(--hub-panel) 94%,transparent);border:1px solid var(--hub-line);border-radius:20px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.muted{color:var(--hub-muted)}.pill{display:inline-block;border:1px solid var(--hub-line);border-radius:999px;padding:5px 8px;margin:2px}.ok{color:#79e6a8}.warn{color:#ffd479}.bad{color:#ff9b9b}.btn,input,select{border:1px solid var(--hub-line);background:var(--hub-panel);color:var(--hub-text);border-radius:11px;padding:10px}.btn{cursor:pointer;font-weight:800}.danger{border-color:#8b414b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.full{grid-column:1/-1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:10px;border:1px solid var(--hub-line);border-radius:12px}.metric b{display:block;font-size:18px}@media(max-width:760px){.grid,.fields,.metrics{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><nav class="top"><b>SETTINGS → AI PROVIDERS</b><a href="/models.html">Legacy routing</a><a href="/command-center.html">Admin</a><button class="btn" onclick="HubTheme.next()">World ◐</button></nav><section class="card"><h1>AI Gateway</h1><p class="muted">One server-side gateway for HOPE, Academy, HYVORA and agent features. Normal users never manage providers.</p><div class="fields"><select id="mode"><option value="auto">Auto — Recommended</option><option value="fastest">Fastest</option><option value="free-first">Free First</option><option value="best-quality">Best Quality</option><option value="manual">Manual</option></select><input id="budget" type="number" min="0" step="1" placeholder="Monthly AI budget USD"><label><input id="freeOnly" type="checkbox" checked> Free Models Only</label><label><input id="paid" type="checkbox"> Allow Paid AI Fallback</label><input id="warning" type="number" min="1" max="100" value="70" placeholder="Budget warning %"><input id="priority" class="full" placeholder="Provider priority: groq,gemini,cloudflare,openrouter,mistral,huggingface,openai"></div><button class="btn" onclick="saveGateway()">Save gateway policy</button><span id="msg" class="muted"></span></section><section id="summary" class="metrics"></section><section id="providers" class="grid"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;async function api(u,o){const r=await fetch(u,{cache:'no-store',credentials:'include',...o}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}function card(p){const c=p.connection,connected=!!c,oauth=p.auth==='oauth-pkce',cf=p.id==='cloudflare';return `<article class="card"><div class="row"><div><h2 style="margin:0">${esc(p.name)}</h2><span class="pill ${connected?'ok':'warn'}">${connected?'🟢 Connected':'⚪ Not Connected'}</span></div><span class="pill">${esc(p.auth)}</span></div><p class="muted">${esc(p.credentialLabel)} · ${p.freeCapable?'free-tier capable':'premium/paid'}</p><div class="metrics"><div class="metric"><b>${Number(p.models.active_models||0)}</b>models</div><div class="metric"><b>${Number(p.models.free_models||0)}</b>free</div><div class="metric"><b>${Math.round(Number(p.usage.avg_latency||0))} ms</b>avg</div><div class="metric"><b>${Number(p.usage.requests||0)}</b>today</div></div><p>${p.capabilities.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</p>${oauth?`<button class="btn" onclick="location.href='/api/connect/openrouter/start'">${connected?'Reconnect':'Connect'} OpenRouter</button>`:`<div class="fields">${cf?`<input id="account-${p.id}" placeholder="Cloudflare Account ID">`:''}<input class="${cf?'':'full'}" id="key-${p.id}" type="password" autocomplete="off" placeholder="${esc(p.credentialLabel)}"></div><button class="btn" onclick="saveCredential('${p.id}',${cf})">${connected?'Replace Credential':'Configure'}</button>`} <button class="btn" ${connected?'':'disabled'} onclick="test('${p.id}')">Test Connection</button> <button class="btn" ${connected?'':'disabled'} onclick="models('${p.id}')">Discover Models</button> <button class="btn danger" ${connected?'':'disabled'} onclick="disconnect('${p.id}')">Disconnect</button><div id="status-${p.id}" class="muted"></div></article>`}function render(){providers.innerHTML=state.providers.map(card).join('');const req=state.providers.reduce((n,p)=>n+Number(p.usage.requests||0),0),cost=state.providers.reduce((n,p)=>n+Number(p.usage.cost||0),0),mods=state.providers.reduce((n,p)=>n+Number(p.models.active_models||0),0),connected=state.providers.filter(p=>p.configured).length;summary.innerHTML=`<div class="metric"><b>${connected}</b>Connected Providers</div><div class="metric"><b>${mods}</b>Active Models</div><div class="metric"><b>${req}</b>Requests Today</div><div class="metric"><b>$${cost.toFixed(4)}</b>Estimated Cost</div>`;const g=state.settings.find(x=>x.scope==='global'&&x.scope_id==='default');if(g){mode.value=g.mode;budget.value=g.monthly_budget_usd;warning.value=g.warning_percent;freeOnly.checked=!!g.free_only;paid.checked=!!g.allow_paid_fallback;priority.value=JSON.parse(g.provider_priority||'[]').join(',')}}async function load(){state=await api('/api/providers/gateway');render()}async function saveCredential(id,cf){const key=document.querySelector('#key-'+id).value.trim();if(!key)return msg.textContent='Enter the credential first.';const p=state.providers.find(x=>x.id===id),payload={id,provider:id,label:p.name,endpoint:p.endpoint,enabled:false,verifiedFree:false};if(cf){const accountId=document.querySelector('#account-'+id).value.trim();if(!accountId)return msg.textContent='Enter Cloudflare Account ID.';payload.credentials={accountId,apiToken:key}}else payload.apiKey=key;await api('/api/integrations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});document.querySelector('#key-'+id).value='';if(cf)document.querySelector('#account-'+id).value='';msg.textContent='Credential encrypted server-side. Test it before enabling.';await load()}async function test(id){const s=document.querySelector('#status-'+id);s.textContent='Validating credential, models and latency…';try{const r=await api('/api/providers/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:id})});s.textContent=r.message||`Connected · ${r.latencyMs} ms`}catch(e){s.textContent=e.message}await load()}async function models(id){const s=document.querySelector('#status-'+id);s.textContent='Refreshing model registry…';try{const r=await api('/api/providers/models?provider='+encodeURIComponent(id)+'&refresh=1');s.textContent=`${r.models.length} models registered`}catch(e){s.textContent=e.message}await load()}async function disconnect(id){if(!confirm('Disconnect and erase this stored credential?'))return;await api('/api/providers/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'disconnect',provider:id})});await load()}async function saveGateway(){const priorityList=priority.value.split(',').map(x=>x.trim()).filter(Boolean);await api('/api/providers/gateway',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scope:'global',scopeId:'default',mode:mode.value,freeOnly:freeOnly.checked,allowPaidFallback:paid.checked,monthlyBudgetUsd:Number(budget.value||0),warningPercent:Number(warning.value||70),providerPriority:priorityList})});msg.textContent='Gateway policy saved.';await load()}freeOnly.onchange=()=>{if(freeOnly.checked)paid.checked=false};paid.onchange=()=>{if(paid.checked)freeOnly.checked=false};load().catch(e=>msg.textContent=e.message)</script></body></html>
