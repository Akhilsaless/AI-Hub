<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate OpenRouter</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0f1117;color:#fff;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,520px);background:#171b24;border:1px solid #2a3040;border-radius:24px;padding:28px;box-shadow:0 24px 80px #0008}h1{margin:0 0 10px;font-size:34px}.muted{color:#aab2c4;line-height:1.5}.step{padding:13px 14px;border-radius:14px;background:#202633;margin-top:10px}.ok{background:#12351f}.err{background:#3c171b}.btn{width:100%;margin-top:18px;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;background:#fff;color:#111}.btn:disabled{opacity:.55}.small{font-size:13px;color:#9aa3b8;margin-top:12px}</style></head><body><div class="card"><h1>OpenRouter activation</h1><p class="muted">This runs the complete safe setup in one pass: health check, free-model discovery, automatic zero-cost activation, and router verification.</p><div id="s1" class="step">1. Waiting to test OpenRouter…</div><div id="s2" class="step">2. Waiting to qualify free models…</div><div id="s3" class="step">3. Waiting to verify routing…</div><button id="go" class="btn">Activate OpenRouter for Hope</button><p id="msg" class="small"></p></div><script>const go=document.getElementById('go'),msg=document.getElementById('msg');async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(r.status===401)throw new Error('Owner session expired. Go back to AI Hub, sign in, then return here.');if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}go.onclick=async()=>{go.disabled=true;msg.textContent='Working…';try{document.getElementById('s1').textContent='1. Testing OpenRouter and discovering models…';const t=await api('/api/providers/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:'openrouter'})});document.getElementById('s1').className='step ok';document.getElementById('s1').textContent=`1. OpenRouter healthy · ${t.latencyMs} ms`;if(!t.autoActivated||!t.activatedModel)throw new Error(`No qualified zero-cost OpenRouter model was activated. Found ${t.qualifiedFree||0} free models.`);document.getElementById('s2').className='step ok';document.getElementById('s2').textContent=`2. Activated free model: ${t.activatedModel}`;const r=await api('/api/router/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task:'chat'})});const routes=r.candidates||r.routes||[];if(!routes.length)throw new Error('Activation succeeded but the Zero-Cost Router still has no eligible route.');document.getElementById('s3').className='step ok';document.getElementById('s3').textContent=`3. Router ready · ${routes.length} eligible route${routes.length===1?'':'s'}`;go.textContent='Open Hope';go.disabled=false;go.onclick=()=>location.href='/hope.html';msg.textContent='Ready. Hope can now use the activated zero-cost route.'}catch(e){msg.textContent=e.message;go.disabled=false;go.textContent='Try activation again';const steps=[...document.querySelectorAll('.step')];const pending=steps.find(x=>!x.classList.contains('ok'));if(pending)pending.className='step err'}};</script></body></html>
