<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>HOPE — AI Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f7f9ff;font:15px Inter,system-ui,sans-serif}.app{max-width:940px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:5;padding:12px 14px;border-bottom:1px solid #263247;background:#080b12e8;backdrop-filter:blur(18px);display:flex;align-items:center;gap:10px}.round{width:42px;height:42px;border:1px solid #263247;border-radius:50%;background:#10151f;color:#fff;font-size:18px}.brand{font-weight:900;letter-spacing:.08em}.meta{color:#8e9aaf;font-size:12px}.actions{margin-left:auto;display:flex;gap:6px}.actions button,.back{color:#fff;text-decoration:none;border:1px solid #263247;background:#10151f;padding:8px 10px;border-radius:11px}.chat{padding:20px 14px 170px}.welcome{text-align:center;padding:10vh 10px 30px}.welcome h1{font-size:clamp(34px,7vw,58px);margin:0}.welcome p{color:#8e9aaf}.msg{max-width:84%;padding:12px 15px;border-radius:18px;margin:10px 0;white-space:pre-wrap;line-height:1.55}.user{margin-left:auto;background:#edf8ff;color:#071019}.assistant{background:#10151f;border:1px solid #263247}.bar{position:fixed;z-index:6;bottom:0;left:0;right:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#080b12 22%)}.composer{max-width:912px;margin:auto;border:1px solid #263247;background:#10151f;border-radius:26px;padding:8px;display:flex;gap:7px;align-items:flex-end}.composer textarea{flex:1;resize:none;min-height:44px;max-height:140px;border:0;outline:0;background:transparent;color:#fff;padding:11px 4px;font:inherit}.composer button,.moods button{border:1px solid #263247;background:#151c28;color:#fff;border-radius:12px;padding:10px 12px}.moods{max-width:912px;margin:0 auto 7px;display:flex;gap:6px;overflow:auto}.moods button.active,.voice.on{background:#edf8ff;color:#071019}.drawer{position:fixed;z-index:20;inset:0 auto 0 0;width:min(360px,88vw);background:#0e141f;border-right:1px solid #263247;padding:16px;transform:translateX(-105%);transition:.2s;overflow:auto}.drawer.open{transform:none}.scrim{position:fixed;inset:0;background:#0009;z-index:19}.hidden{display:none!important}.nav{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:11px;border-radius:11px}.nav:hover{background:#151c28}.section{margin:18px 8px 7px;color:#8e9aaf;font-size:11px;text-transform:uppercase}.sheet{position:fixed;z-index:30;left:12px;right:12px;bottom:12px;max-width:650px;margin:auto;background:#10151f;border:1px solid #263247;border-radius:23px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{padding:14px;border:1px solid #263247;border-radius:14px;background:#151c28;color:#fff;text-align:left}.picked{max-width:912px;margin:0 auto 5px;color:#8e9aaf;font-size:12px}.danger{color:#ffb4b4!important}.admin{color:#77d9ff!important}@media(max-width:600px){.msg{max-width:94%}.actions .label{display:none}.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><button class="round" id="menu">☰</button><div><div class="brand">HOPE</div><div class="meta" id="state">Ready</div></div><div class="actions"><button class="voice" id="voice">🔊 <span class="label">Voice</span></button><button id="rename">✎ <span class="label">Rename</span></button><button id="trash">🗑 <span class="label">Delete</span></button><a class="back" href="/account.html">Hub</a></div></header><section class="chat"><div class="welcome" id="welcome"><h1>Ask HOPE anything.</h1><p>One HOPE for everyone — conversation, memory, tools, voice and projects.</p></div><div id="messages"></div></section><div class="bar"><div class="picked" id="picked"></div><div class="moods" id="moods"><button data-m="normal" class="active">Normal</button><button data-m="happy">😊 Happy</button><button data-m="funny">😂 Very Funny</button><button data-m="angry">😤 Angry</button></div><div class="composer"><button id="plus">＋</button><textarea id="input" placeholder="Message HOPE…"></textarea><button id="mic">🎙️</button><button id="send">↑</button></div></div></main><input id="file" type="file" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.tsx,.jsx,.html,.css" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><div id="scrim" class="scrim hidden"></div><aside id="drawer" class="drawer"><button class="round" id="close">×</button><div class="section">HOPE</div><button class="nav" id="newChat">＋ New chat</button><div class="section">Recent chats</div><div id="history"></div><div class="section">Workspace</div><button class="nav" onclick="location.href='/account.html'">My Hub</button><button class="nav" onclick="location.href='/connect.html'">Connected apps</button><button class="nav" onclick="location.href='/learn.html'">Academy</button><button class="nav" id="adminLink" hidden>Admin Command Center</button></aside><div id="sheet" class="sheet hidden"></div><script>const $=s=>document.querySelector(s);let mood='normal',busy=false,voiceOn=localStorage.hope_voice==='1',threadId='',attachments=[],me=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)}function add(role,text){welcome.style.display='none';messages.insertAdjacentHTML('beforeend',`<div class="msg ${role}">${esc(text)}</div>`);scrollTo(0,document.body.scrollHeight)}function voiceState(){voice.classList.toggle('on',voiceOn)}function speak(text){if(!voiceOn||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[*#`]/g,''));u.rate=mood==='angry'?1.08:1;u.pitch=mood==='happy'?1.08:mood==='angry'?.9:1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en-IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}function drawer(on=true){$('#drawer').classList.toggle('open',on);scrim.classList.toggle('hidden',!on)}async function threads(){const r=await fetch('/api/user/hope/chat'),d=await r.json();if(r.status===401){location.href='/learn.html';return}me=d.user;if(me?.isOwner){adminLink.hidden=false;adminLink.onclick=()=>location.href='/command-center.html'}history.innerHTML=(d.threads||[]).map(t=>`<button class="nav" onclick="loadThread('${esc(t.id)}')">${esc(t.title)}</button>`).join('')||'<div class="meta">No chats yet.</div>'}async function loadThread(t){threadId=t;messages.innerHTML='';welcome.style.display='block';const r=await fetch('/api/user/hope/chat?thread='+encodeURIComponent(t)),d=await r.json();(d.messages||[]).forEach(x=>add(x.role==='user'?'user':'assistant',x.content));drawer(false)}function newThread(){threadId=id();messages.innerHTML='';welcome.style.display='block';attachments=[];picked.textContent='';drawer(false);input.focus()}function tools(){sheet.innerHTML=`<h3>HOPE Actions</h3><div class="grid"><button class="tool" onclick="file.click();hideSheet()">📎 Attach file / image</button><button class="tool" onclick="camera.click();hideSheet()">📷 Camera</button><button class="tool" onclick="seed('Research this for me: ')">🔎 Research</button><button class="tool" onclick="seed('Help me build or fix: ')">⌨️ Code / Build</button><button class="tool" onclick="location.href='/connect.html'">🔌 Connected apps</button><button class="tool" onclick="seed('Create an automation that: ')">⏱ Automation</button><button class="tool" onclick="seed('Create an image/content concept for: ')">✨ Create</button><button class="tool" onclick="seed('Use the best specialist approach for: ')">🧠 Specialists</button></div>`;sheet.classList.remove('hidden');scrim.classList.remove('hidden')}function hideSheet(){sheet.classList.add('hidden');if(!drawer.classList.contains('open'))scrim.classList.add('hidden')}function seed(s){hideSheet();input.value=s;input.focus()}function pickedFiles(list){attachments=[...list].slice(0,8).map(x=>({name:x.name,type:x.type,size:x.size}));picked.textContent=attachments.map(x=>x.name).join(' · ')}moods.onclick=e=>{const b=e.target.closest('button');if(!b)return;mood=b.dataset.m;[...moods.children].forEach(x=>x.classList.toggle('active',x===b))};voice.onclick=()=>{voiceOn=!voiceOn;localStorage.hope_voice=voiceOn?'1':'0';if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();voiceState()};menu.onclick=()=>drawer();close.onclick=()=>drawer(false);scrim.onclick=()=>{drawer(false);hideSheet()};plus.onclick=tools;file.onchange=e=>pickedFiles(e.target.files);camera.onchange=e=>pickedFiles(e.target.files);newChat.onclick=newThread;rename.onclick=async()=>{if(!threadId)return;const title=prompt('Rename conversation');if(!title)return;await fetch('/api/user/hope/chat',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({threadId,title})});threads()};trash.onclick=async()=>{if(!threadId||!confirm('Delete this conversation? HOPE long-term memory will be kept.'))return;await fetch('/api/user/hope/chat?thread='+encodeURIComponent(threadId),{method:'DELETE'});newThread();threads()};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='en-IN';mic.onclick=()=>{state.textContent='Listening…';rec.start()};rec.onresult=e=>{input.value=e.results[0][0].transcript;state.textContent='Ready';sendNow()};rec.onerror=()=>state.textContent='Microphone error'}else mic.onclick=()=>alert('Speech input is not supported by this browser.');async function sendNow(){const text=input.value.trim();if((!text&&!attachments.length)||busy)return;if(!threadId)threadId=id();busy=true;input.value='';add('user',text||attachments.map(x=>x.name).join(', '));state.textContent='Thinking…';try{const r=await fetch('/api/user/hope/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text,mood,threadId,attachments})}),d=await r.json();attachments=[];picked.textContent='';if(r.status===401){location.href='/learn.html';return}if(!r.ok)add('assistant',d.error||'HOPE could not complete that request.');else{threadId=d.threadId||threadId;add('assistant',d.text||'');speak(d.text||'');threads()}state.textContent=d.provider?`${d.provider} · ${d.model||'HOPE'}`:'Ready'}catch{add('assistant','Connection error. Please try again.');state.textContent='Connection error'}finally{busy=false}}send.onclick=sendNow;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendNow()}});voiceState();newThread();threads()</script></body></html>
