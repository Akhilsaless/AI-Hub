<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HOPE — AI Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f7f9ff;font:15px Inter,system-ui,sans-serif}.app{max-width:900px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:5;padding:14px 16px;border-bottom:1px solid #263247;background:#080b12e8;backdrop-filter:blur(18px);display:flex;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.08em}.meta{color:#8e9aaf;font-size:12px}.actions{margin-left:auto;display:flex;gap:7px}.actions button,.back{color:#fff;text-decoration:none;border:1px solid #263247;background:#10151f;padding:8px 11px;border-radius:11px}.chat{padding:20px 14px 165px}.welcome{text-align:center;padding:10vh 10px 30px}.welcome h1{font-size:clamp(34px,7vw,58px);margin:0}.welcome p{color:#8e9aaf}.msg{max-width:84%;padding:12px 15px;border-radius:18px;margin:10px 0;white-space:pre-wrap;line-height:1.55}.user{margin-left:auto;background:#edf8ff;color:#071019}.assistant{background:#10151f;border:1px solid #263247}.bar{position:fixed;z-index:6;bottom:0;left:0;right:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#080b12 22%)}.composer{max-width:872px;margin:auto;border:1px solid #263247;background:#10151f;border-radius:24px;padding:8px;display:flex;gap:8px}.composer textarea{flex:1;resize:none;min-height:44px;max-height:140px;border:0;outline:0;background:transparent;color:#fff;padding:11px;font:inherit}.composer button,.moods button{border:1px solid #263247;background:#151c28;color:#fff;border-radius:12px;padding:10px 13px}.moods{max-width:872px;margin:0 auto 7px;display:flex;gap:6px;overflow:auto}.moods button.active{background:#edf8ff;color:#071019}.voice.on{background:#edf8ff;color:#071019}.err{color:#ffb4b4}@media(max-width:600px){.msg{max-width:94%}.actions .label{display:none}}</style></head><body><main class="app"><header class="top"><div><div class="brand">HOPE</div><div class="meta" id="state">Customer AI · private workspace</div></div><div class="actions"><button class="voice" id="voice" title="Voice replies">🔊 <span class="label">Voice</span></button><button id="clear" title="Delete conversation">🗑 <span class="label">Delete chat</span></button><a class="back" href="/account.html">Hub</a></div></header><section class="chat"><div class="welcome" id="welcome"><h1>Ask HOPE anything.</h1><p>Talk naturally. Choose HOPE's mood, use your microphone, and optionally hear replies aloud.</p></div><div id="messages"></div></section><div class="bar"><div class="moods" id="moods"><button data-m="normal" class="active">Normal</button><button data-m="happy">😊 Happy</button><button data-m="funny">😂 Very Funny</button><button data-m="angry">😤 Angry</button></div><div class="composer"><button id="mic" title="Speak">🎙️</button><textarea id="input" placeholder="Message HOPE…"></textarea><button id="send">Send</button></div></div></main><script>const $=s=>document.querySelector(s);let mood='normal',busy=false,voiceOn=localStorage.getItem('hope_voice')==='1';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function add(role,text,extra=''){welcome.style.display='none';messages.insertAdjacentHTML('beforeend',`<div class="msg ${role} ${extra}">${esc(text)}</div>`);scrollTo(0,document.body.scrollHeight)}function voiceState(){voice.classList.toggle('on',voiceOn);voice.title=voiceOn?'Voice replies on':'Voice replies off'}function speak(text){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[*#`]/g,''));u.rate=1;u.pitch=mood==='happy'?1.08:mood==='angry'?.92:1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en-IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}async function boot(){voiceState();const r=await fetch('/api/user/hope/chat');if(r.status===401||r.status===403){location.href='/login.html';return}const d=await r.json();if(d.ok)(d.messages||[]).forEach(x=>add(x.role==='user'?'user':'assistant',x.content))}moods.onclick=e=>{const b=e.target.closest('button');if(!b)return;mood=b.dataset.m;[...moods.children].forEach(x=>x.classList.toggle('active',x===b))};voice.onclick=()=>{voiceOn=!voiceOn;localStorage.setItem('hope_voice',voiceOn?'1':'0');if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();voiceState()};clear.onclick=async()=>{if(!confirm('Delete this conversation? HOPE memory will be kept.'))return;const r=await fetch('/api/user/hope/chat',{method:'DELETE'});if(r.ok){messages.innerHTML='';welcome.style.display='block';if('speechSynthesis'in window)speechSynthesis.cancel()}};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='en-IN';rec.interimResults=false;mic.onclick=()=>{state.textContent='Listening…';rec.start()};rec.onresult=e=>{input.value=e.results[0][0].transcript;state.textContent='Ready';send()};rec.onerror=()=>state.textContent='Microphone error'}else mic.onclick=()=>alert('Speech input is not supported by this browser.');async function send(){const text=input.value.trim();if(!text||busy)return;busy=true;input.value='';add('user',text);state.textContent='Thinking…';try{const r=await fetch('/api/user/hope/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text,mood})});const d=await r.json();if(r.status===401||r.status===403){location.href='/login.html';return}if(!r.ok)add('assistant',d.error||'HOPE could not complete that request.','err');else{add('assistant',d.text||'');speak(d.text||'')}state.textContent=d.provider?`${d.provider} · ${d.model||'HOPE'}`:'Ready'}catch(e){add('assistant','Connection error. Please try again.','err');state.textContent='Connection error'}finally{busy=false}}send.onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});boot()</script></body></html>
