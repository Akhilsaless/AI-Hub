<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify HOPE Credential</title><link rel="stylesheet" href="/hub-themes.css"><style>body{margin:0;font:16px Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:8vh auto;padding:22px}.card{padding:30px;border:1px solid var(--hub-line);background:var(--hub-panel);border-radius:26px}.ok{font-size:52px}h1{font-size:38px}.meta{color:var(--hub-muted)}.id{font-family:monospace;padding:12px;border:1px solid var(--hub-line);border-radius:12px;display:inline-block}</style><script src="/theme-runtime.js"></script></head><body><main class="wrap"><div class="card" id="v">Verifying…</div></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id')||'',el=document.querySelector('#v');try{const r=await fetch('/api/academy/verify?id='+encodeURIComponent(id)),j=await r.json();if(!j.verified)throw Error(j.status==='revoked'?'This credential has been revoked.':'Credential not found or invalid.');el.innerHTML=`<div class="ok">✓</div><div class="meta">HOPE VERIFIED CREDENTIAL</div><h1>${j.title}</h1><p class="id">${j.id}</p><p>Issued ${new Date(j.issuedAt).toLocaleDateString()}</p><p class="meta">Evidence: mastery ${j.evidence.average??'—'}% · required ${j.evidence.requiredMastery??'—'}%${j.evidence.capstoneDone!==undefined?' · capstone '+(j.evidence.capstoneDone?'passed':'not passed'):''}</p><p><a href="/learn.html">HOPE AI Academy</a></p>`}catch(e){el.innerHTML=`<div class="ok">×</div><h1>Not verified</h1><p>${e.message}</p>`}})()</script></body></html>
