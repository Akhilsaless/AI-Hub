<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOPE Skill Passport</title><link rel="stylesheet" href="/hub-themes.css"><style>body{margin:0;font:15px Inter,system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:28px}.hero,.card{border:1px solid var(--hub-line);background:var(--hub-panel);border-radius:24px;padding:24px;margin-bottom:16px}h1{font-size:46px;margin:8px 0}.meta{color:var(--hub-muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.pill{display:inline-block;border:1px solid var(--hub-line);border-radius:999px;padding:7px 10px;margin:3px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><script src="/theme-runtime.js"></script></head><body><main class="wrap" id="app">Loading Skill Passport…</main><script>(async()=>{const slug=new URLSearchParams(location.search).get('u')||'',a=document.querySelector('#app');try{const r=await fetch('/api/academy/public-profile?slug='+encodeURIComponent(slug)),j=await r.json();if(!r.ok)throw Error(j.error||'Profile unavailable');a.innerHTML=`<section class="hero"><div class="meta">HOPE AI ACADEMY · SKILL PASSPORT</div><h1>${j.profile.displayName}</h1><p>${j.profile.bio||'Evidence-backed AI learning profile.'}</p></section><h2>Verified credentials</h2><div class="grid">${j.credentials.map(c=>`<article class="card"><div class="meta">VERIFIED</div><h3>🏅 ${c.title}</h3><p class="meta">${c.credential_id}</p><a href="${c.verifyPath}">Verify credential →</a></article>`).join('')||'<div class="card">No public credentials yet.</div>'}</div><h2>Portfolio projects</h2><div class="grid">${j.projects.map(p=>`<article class="card"><h3>${p.title}</h3><p>${p.summary}</p><div>${p.skills.map(s=>`<span class="pill">${s}</span>`).join('')}</div></article>`).join('')||'<div class="card">No public portfolio projects yet.</div>'}</div>`}catch(e){a.innerHTML=`<section class="card"><h1>Profile unavailable</h1><p>${e.message}</p></section>`}})()</script></body></html>
