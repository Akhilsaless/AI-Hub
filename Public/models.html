<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Hub · Model Marketplace</title><style>*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,sans-serif;background:#f5f7fb;color:#111}.shell{max-width:1180px;margin:auto;padding:20px}.hero{padding:26px;border-radius:24px;background:linear-gradient(135deg,#111827,#312e81);color:#fff}.row,.filters,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row{justify-content:space-between}.filters{margin:16px 0}.btn,.filter{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.btn{background:#111;color:#fff}.secondary,.filter{background:#fff;color:#111;border:1px solid #dfe3ea}.filter.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:18px;padding:17px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef1f5;font-size:11px;margin:2px}.free{background:#e5f8eb;color:#17652d}.promo{background:#fff2cc;color:#765c00}.connected{background:#e7efff;color:#244a9b}.muted{color:#6c7584;line-height:1.45}.form{display:none;margin-top:12px}.form.open{display:block}input{width:100%;padding:11px;border:1px solid #d8dde6;border-radius:10px;margin:5px 0}.status{font-size:12px;color:#667085}.caps{margin:10px 0}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:29px}}</style></head><body><main class="shell"><section class="hero"><div class="row"><div><h1>AI Model Marketplace</h1><p>Connect free tiers, promotional-credit providers and optional paid models. AI Hub keeps temporary credits separate from permanent zero-cost routes.</p></div><button class="btn secondary" onclick="location.href='/'">← AI Hub</button></div><div id="summary">Loading current catalog…</div></section><div class="filters"><button class="filter active" data-f="all">All</button><button class="filter" data-f="connected">Connected</button><button class="filter" data-f="free">Free now</button><button class="filter" data-f="promo">Credits / promos</button><input id="q" placeholder="Search providers or capabilities" style="max-width:280px"></div><div id="grid" class="grid"></div></main><script>const $=s=>document.querySelector(s);let data=[],filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('Owner login required')}if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}function group(p){if(/free/.test(p.offerKind))return'free';if(/credit|promo|trial/.test(p.offerKind))return'promo';return'other'}function render(){let q=$('#q').value.toLowerCase(),items=data.filter(p=>(filter==='all'||(filter==='connected'&&p.connection)||group(p)===filter)&&(!q||`${p.name} ${p.capabilities.join(' ')} ${p.offerLabel}`.toLowerCase().includes(q)));$('#grid').innerHTML=items.map(p=>{let c=p.connection,g=group(p),method=p.connectMethod==='oauth'?'One-click authorization':p.connectMethod==='api-key'?'API key required by provider':p.connectMethod==='guided'?'Guided provider connection':'Custom endpoint';return `<article class="card"><div class="row"><h3>${esc(p.name)}</h3><span class="pill ${c?'connected':''}">${c?'Connected':'Not connected'}</span></div><span class="pill ${g}">${esc(p.offerKind)}</span><p><b>${esc(p.offerLabel)}</b></p><p class="muted">${esc(p.note)}</p><div class="caps">${p.capabilities.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="status">${method} · verified ${esc(p.lastVerified)}</div><div class="actions">${p.connectMethod==='oauth'?`<button class="btn" onclick="location.href='${p.connectPath}'">${c?'Reconnect':'Connect'}</button>`:`<button class="btn" onclick="toggle('${p.id}')">${c?'Edit':'Connect'}</button>`}${p.officialUrl?`<button class="btn secondary" onclick="window.open('${p.officialUrl}','_blank')">Official info</button>`:''}${c&&p.discoverable?`<button class="btn secondary" onclick="discover('${p.id}')">Discover models</button>`:''}</div>${p.connectMethod==='oauth'?'':`<div class="form" id="f-${p.id}">${p.connectMethod==='api-key'?`<input id="k-${p.id}" type="password" placeholder="API key (stored encrypted)">`:''}<input id="e-${p.id}" value="${esc(c?.endpoint||p.endpoint||'')}" placeholder="API endpoint"><input id="m-${p.id}" value="${esc(c?.model||'')}" placeholder="Preferred model (optional)">${p.signupUrl?`<button class="btn secondary" onclick="window.open('${p.signupUrl}','_blank')">Open provider setup</button>`:''}<button class="btn" onclick="save('${p.id}')">Save connection</button><div id="s-${p.id}" class="status"></div></div>`}</article>`}).join('')||'<p>No matching providers.</p>'}function toggle(id){$('#f-'+id)?.classList.toggle('open')}async function save(id){let p=data.find(x=>x.id===id),s=$('#s-'+id);s.textContent='Saving…';try{await api('/api/integrations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,provider:id,label:p.name,apiKey:$('#k-'+id)?.value||'',endpoint:$('#e-'+id)?.value||p.endpoint||'',model:$('#m-'+id)?.value||'',verifiedFree:false,enabled:false})});s.textContent='Connected. Discover/test before enabling for routing.';await load()}catch(e){s.textContent=e.message}}async function discover(id){try{let j=await api('/api/providers/discover',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:id})});alert(`Found ${j.count} models; ${j.qualifiedFree} automatically verified zero-cost.`)}catch(e){alert(e.message)}}async function load(){let j=await api('/api/providers/catalog');data=j.providers;$('#summary').textContent=`${j.counts.providers} providers · ${j.counts.freeOrCredit} free/credit/trial candidates · catalog verified ${j.version}`;render()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});$('#q').oninput=render;load().catch(e=>$('#summary').textContent=e.message)</script></body></html>
