<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HOPE · Owner AI routing</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,sans-serif;background:#080b12;color:#f7f9ff}.shell{max-width:1180px;margin:auto;padding:20px}.hero,.card{background:#10151f;border:1px solid #263247;border-radius:22px;padding:20px}.hero{background:linear-gradient(135deg,#101d2a,#172033);margin-bottom:14px}.row,.actions,.metrics{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row{justify-content:space-between}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#f7f9ff;color:#080b12}.secondary{background:#202837;color:#f7f9ff;border:1px solid #34415a}.danger{background:#53252d;color:#ffdce1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.muted{color:#98a4b8;line-height:1.5}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#202a3c;font-size:11px;margin:2px}.healthy{background:#143b2b;color:#9ef2c3}.bad{background:#4b2228;color:#ffc1c8}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.full{grid-column:1/-1}input{width:100%;padding:11px;border:1px solid #34415a;border-radius:10px;background:#080b12;color:#fff}.metric{padding:9px 11px;border:1px solid #29364b;border-radius:12px;background:#0b1019}.metric b{display:block}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="row"><div><div class="pill">OWNER ONLY</div><h1>HOPE AI routing</h1><p class="muted">HOPE chooses providers and models automatically. These controls are never shown to normal users.</p></div><button class="btn secondary" onclick="location.href='/command-center.html'">Command Center</button></div>
      <div class="actions"><button id="stop" class="btn danger">Emergency AI stop</button><button class="btn secondary" onclick="load()">Refresh health</button></div>
    </section>
    <div id="message" class="muted"></div>
    <section id="providers" class="grid"></section>
  </main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let catalog=[],state={providers:[]};
    async function api(u,o){const r=await fetch(u,{cache:'no-store',credentials:'include',...o}),j=await r.json().catch(()=>({}));if(r.status===401){location.href='/hope';throw Error('Owner access required')}if(!r.ok){const e=Error(j.error||`HTTP ${r.status}`);e.status=r.status;throw e}return j}
    function setting(id){return state.providers.find(x=>x.provider===id)||{provider:id,configured:false,health:'unchecked',usageToday:{requests:0,estimatedCostUsd:0},usageMonth:{requests:0,estimatedCostUsd:0}}}
    function card(p){const s=setting(p.id),special=p.id==='openai'||p.id==='openrouter',health=s.health==='healthy'?'healthy':s.health==='unhealthy'?'bad':'';return `<article class="card" data-provider="${p.id}"><div class="row"><div><h2 style="margin:0 0 5px">${esc(p.name)}</h2><span class="pill ${health}">${esc(s.health)}</span> ${s.configured?'<span class="pill">Configured</span>':'<span class="pill">Not connected</span>'}</div><label><input id="enabled-${p.id}" type="checkbox" style="width:auto" ${s.enabled?'checked':''} ${!s.configured?'disabled':''}> Enabled</label></div><p class="muted">${esc(p.note)}</p><div class="metrics"><div class="metric"><b>${s.usageToday.requests}</b>requests today</div><div class="metric"><b>$${Number(s.usageToday.estimatedCostUsd||0).toFixed(4)}</b>estimated today</div><div class="metric"><b>${s.usageMonth.requests}</b>requests this month</div></div><div class="form"><input id="daily-${p.id}" type="number" min="0" step="0.01" value="${s.dailyBudgetUsd||0}" placeholder="Daily budget USD"><input id="monthly-${p.id}" type="number" min="0" step="0.01" value="${s.monthlyBudgetUsd||0}" placeholder="Monthly budget USD"><input id="warning-${p.id}" type="number" min="1" max="100" value="${s.warningPercent||80}" placeholder="Warning %">${p.connectMethod==='api-key'?`<input id="key-${p.id}" type="password" autocomplete="off" placeholder="API key · never returned to browser">`:''}</div><div class="actions" style="margin-top:12px">${p.id==='openrouter'?`<button class="btn" onclick="location.href='/api/connect/openrouter/start'">${s.configured?'Reconnect':'Connect'} OpenRouter</button>`:p.connectMethod==='api-key'?`<button class="btn" onclick="saveKey('${p.id}')">${s.configured?'Replace':'Connect'} key</button>`:''}<button class="btn secondary" ${!s.configured?'disabled':''} onclick="testProvider('${p.id}')">Test</button><button class="btn secondary" ${!s.configured?'disabled':''} onclick="saveSettings('${p.id}')">Save limits</button><button class="btn danger" ${!s.configured?'disabled':''} onclick="disconnect('${p.id}')">Disconnect</button></div>${s.lastSuccessfulCall?`<p class="muted">Last successful call: ${esc(s.lastSuccessfulCall)}</p>`:''}${s.lastError?`<p class="muted">Last error: ${esc(s.lastError)}</p>`:''}${p.id==='openai'?'<p class="muted"><b>Current state:</b> production slot prepared and disabled. It will not spend anything until a funded key, budgets and Owner enable are all present.</p>':''}</article>`}
    function render(){const rank=id=>id==='openai'?0:id==='openrouter'?1:2,items=[...catalog].sort((a,b)=>rank(a.id)-rank(b.id)||a.name.localeCompare(b.name));providers.innerHTML=items.map(card).join('');stop.textContent=state.emergencyStop?'Resume AI routing':'Emergency AI stop'}
    async function load(){const me=await api('/api/account/me');if(!me.user?.isOwner){location.href='/hope';return}const [c,s]=await Promise.all([api('/api/providers/catalog'),api('/api/providers/settings')]);catalog=c.providers;state=s;render()}
    async function saveKey(id){const p=catalog.find(x=>x.id===id),key=document.querySelector(`#key-${id}`)?.value.trim();if(!key){message.textContent='Enter the provider key first.';return}message.textContent='Encrypting and saving credential…';await api('/api/integrations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,provider:id,label:p.name,apiKey:key,endpoint:p.endpoint||'',model:'',verifiedFree:false,enabled:false})});document.querySelector(`#key-${id}`).value='';message.textContent='Credential saved server-side. Test it before enabling.';await load()}
    async function testProvider(id){message.textContent=`Testing ${id}…`;try{const r=await api('/api/providers/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:id})});message.textContent=r.message||`${id} responded in ${r.latencyMs} ms.`}catch(e){message.textContent=e.message}await load()}
    async function saveSettings(id){const enabled=document.querySelector(`#enabled-${id}`).checked,daily=Number(document.querySelector(`#daily-${id}`).value||0),monthly=Number(document.querySelector(`#monthly-${id}`).value||0),warning=Number(document.querySelector(`#warning-${id}`).value||80);if(id==='openai'&&enabled&&(daily<=0||monthly<=0)){message.textContent='Set both OpenAI daily and monthly budgets before enabling it.';return}await api('/api/providers/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'update',provider:id,enabled,dailyBudgetUsd:daily,monthlyBudgetUsd:monthly,warningPercent:warning})});message.textContent=`${id} settings saved.`;await load()}
    async function disconnect(id){if(!confirm(`Disconnect ${id} and remove its stored credential?`))return;await api('/api/providers/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'disconnect',provider:id})});message.textContent=`${id} disconnected.`;await load()}
    stop.onclick=async()=>{const stopped=!state.emergencyStop;if(!confirm(stopped?'Stop all AI routing immediately?':'Resume routing? Providers remain subject to their individual enabled settings.'))return;await api('/api/providers/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'emergency-stop',stopped})});await load()};
    load().catch(e=>message.textContent=e.message);
  </script>
</body>
</html>
