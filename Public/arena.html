<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proof Arena · AI Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#070914;color:#f7f7fb;font:15px Inter,system-ui}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.pill,.btn{border:1px solid #2a3049;background:#12172a;color:#fff;border-radius:999px;padding:10px 14px;text-decoration:none}.hero{margin:24px 0;padding:30px;border:1px solid #2a3150;border-radius:28px;background:radial-gradient(circle at 80% 0,#7c3aed55,transparent 35%),#101426}h1{font-size:clamp(38px,6vw,70px);line-height:.95;margin:8px 0}.sub,.meta{color:#aeb5cb}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{padding:20px;border:1px solid #282e48;border-radius:20px;background:#0f1324}.arena{cursor:pointer}.arena:hover{border-color:#8b5cf6}.score{font-size:28px;font-weight:900}.verified{color:#34d399}.tag{font-size:11px;padding:5px 8px;border-radius:8px;background:#1c2237}.panel{display:none}.panel.open{display:block}.rubric{display:flex;gap:6px;flex-wrap:wrap}.field{width:100%;min-height:110px;background:#0b0f1d;border:1px solid #2c334d;border-radius:14px;color:#fff;padding:13px;margin:7px 0;font:inherit}.primary{border:0;background:linear-gradient(90deg,#7c3aed,#2563eb);font-weight:800}.result{margin-top:14px;padding:18px;border-radius:16px;background:#11182b}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:13px}}</style></head><body><div class="wrap"><div class="top"><a class="pill" href="/learn.html">← Learn</a><a class="pill" href="/hope.html">Ask HOPE</a></div><section class="hero"><div class="meta">AI SKILL PASSPORT · VERIFIED EVIDENCE</div><h1>Don't tell us<br>you're good at AI.<br><span style="color:#a78bfa">Prove it.</span></h1><p class="sub">Real missions create evidence for your Skill Passport. Passing isn't enough — verification quality matters.</p></section><div id="list" class="grid"></div><section id="panel" class="panel card"></section></div><script>let arenas=[],$=s=>document.querySelector(s);async function api(u,o){const r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function boot(){try{const d=await api('/api/academy/arenas');arenas=d.arenas;render()}catch(e){$('#list').innerHTML=`<div class="card">${e.message}. <a href="/learn.html">Open Learn</a> and sign in.</div>`}}function render(){$('#list').innerHTML=arenas.map(a=>`<div class="card arena" onclick="openArena('${a.id}')"><div class="meta">${a.skill.toUpperCase()} · ${a.progress.attempts||0} ATTEMPTS</div><h2>${a.title}</h2><p class="sub">${a.prompt}</p><div class="rubric">${a.rubric.map(x=>`<span class="tag">${x}</span>`).join('')}</div><p><span class="score">${a.progress.best_score||0}</span>/100 ${Number(a.progress.verified)?'<b class="verified">✓ VERIFIED</b>':''}</p></div>`).join('')}function openArena(id){const a=arenas.find(x=>x.id===id),p=$('#panel');p.classList.add('open');p.scrollIntoView({behavior:'smooth'});p.innerHTML=`<button class="pill" onclick="$('#panel').classList.remove('open')">Close</button><div class="meta" style="margin-top:18px">PROOF MISSION · ${a.skill.toUpperCase()}</div><h2>${a.title}</h2><p>${a.prompt}</p><div class="rubric">${a.rubric.map(x=>`<span class="tag">${x}</span>`).join('')}</div><h3>Your work</h3><textarea class="field" id="response" placeholder="Show your reasoning, decisions and outcome..."></textarea><textarea class="field" id="comparison" placeholder="Comparison / why this approach won (when relevant)..."></textarea><textarea class="field" id="verification" placeholder="How did you verify the result? What evidence proves it works?"></textarea><textarea class="field" id="artifact" placeholder="Optional artifact, architecture, workflow or build notes..."></textarea><button class="btn primary" onclick="submitProof('${id}')">Submit proof →</button><div id="result"></div>`}async function submitProof(id){try{const evidence={response:$('#response').value,comparison:$('#comparison').value,verification:$('#verification').value,artifact:$('#artifact').value},r=await api('/api/academy/proof',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({arenaId:id,evidence})});$('#result').innerHTML=`<div class="result"><div class="score">${r.score}/100</div><b class="${r.verified?'verified':''}">${r.verified?'✓ VERIFIED PROOF':r.passed?'PASSED · NEEDS STRONGER PROOF':'KEEP BUILDING'}</b><p>${r.feedback}</p><div class="meta">Skill Passport: ${r.skill} ${r.skillScore}/100</div></div>`;const d=await api('/api/academy/arenas');arenas=d.arenas}catch(e){$('#result').innerHTML=`<div class="result">${e.message}</div>`}}boot()</script></body></html>
