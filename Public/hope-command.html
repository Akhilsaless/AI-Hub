<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOPE Command Center</title><style>body{margin:0;background:#08090c;color:#f7f8fb;font:15px system-ui}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.card{background:#12151c;border:1px solid #252b37;border-radius:18px;padding:16px}.big{font-size:28px;font-weight:800}.muted{color:#9da6b6}.btn{border:1px solid #333b4b;background:#181d27;color:white;border-radius:12px;padding:11px 13px;margin:5px 5px 0 0}.item{padding:9px 0;border-bottom:1px solid #242a35}.ok{color:#aef0bf}.warn{color:#ffd18b}a{color:#b9d7ff}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">HOPE 2.1</div><h1>Today</h1></div><a href="/hope.html">Talk to HOPE</a></div><div id="summary" class="grid"></div><div class="grid"><div class="card"><h3>Needs your attention</h3><div id="attention"></div></div><div class="card"><h3>Trust</h3><div id="trust"></div></div><div class="card"><h3>Quick actions</h3><button class="btn" onclick="cmd('What needs my attention?')">What needs my attention?</button><button class="btn" onclick="cmd('Handle what you can')">Handle what you can</button><button class="btn" onclick="cmd('Continue everything')">Continue everything</button><button class="btn" onclick="location='/api/hope/export'">Export my HOPE data</button><pre id="result" class="muted" style="white-space:pre-wrap"></pre></div></div></div><script>async function load(){const r=await fetch('/api/hope/dashboard');if(r.status===401){location='/';return}const j=await r.json(),d=j.today||{},t=j.trust||{};summary.innerHTML=[['Needs you',(d.needsYou||[]).length],['Waiting',(d.waiting||[]).length],['Running',(d.running||[]).length],['Active goals',(d.activeGoals||[]).length],['Completed',d.recentlyCompleted||0],['AI spend',`$${Number(d.aiSpendToday||0).toFixed(4)}`]].map(x=>`<div class=card><div class=big>${x[1]}</div><div class=muted>${x[0]}</div></div>`).join('');trust.innerHTML=`<div class=item><span class=ok>${t.verifiedSkills||0}</span> verified skills</div><div class=item>${t.successfulMissions||0} successful missions</div><div class=item><span class=warn>${t.failedMissions||0}</span> failed missions</div><div class=item>${t.pendingApprovals||0} pending approvals</div>`;attention.innerHTML=(d.needsYou||[]).slice(0,8).map(x=>`<div class=item><b>${x.subject||x.kind}</b><div class=muted>${x.state||x.nextAction||''}</div></div>`).join('')||'<div class=muted>Nothing urgent.</div>'}async function cmd(command){result.textContent='Working…';const r=await fetch('/api/hope/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command})});result.textContent=JSON.stringify(await r.json(),null,2);load()}load()</script></body></html>
