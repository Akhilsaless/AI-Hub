<!doctype html><html data-theme="ai-night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Playground · HOPE</title><link rel="stylesheet" href="/hub-themes.css"><script src="/theme-runtime.js"></script><style>*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui}.wrap{max-width:980px;margin:auto;padding:22px}.card{background:var(--hub-panel);border:1px solid var(--hub-line);border-radius:20px;padding:18px;margin:12px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1}select,textarea,button{background:var(--hub-panel);color:var(--hub-text);border:1px solid var(--hub-line);border-radius:11px;padding:11px}textarea{width:100%;min-height:150px;resize:vertical}button{cursor:pointer;font-weight:800}.muted{color:var(--hub-muted)}pre{white-space:pre-wrap;word-break:break-word;background:color-mix(in srgb,var(--hub-panel) 80%,#000);padding:14px;border-radius:12px;min-height:90px}</style></head><body><main class="wrap"><p><a href="/ai-providers.html">← AI Providers</a></p><section class="card"><h1>AI Playground / Provider Tester</h1><p class="muted">Owner-only direct provider verification. Prompts stay server-side and credentials are never returned.</p><div class="row"><select id="provider"></select><select id="model"></select><select id="feature"><option>chat</option><option>coding</option><option>analysis</option><option>vision</option><option>agent</option></select></div><p><textarea id="prompt" placeholder="Enter a small test prompt…">Reply with exactly: gateway test successful</textarea></p><button id="run">Run provider test</button><span id="status" class="muted"></span></section><section class="card"><h2>Normalized result</h2><pre id="output">Ready.</pre></section></main><script>async function api(u,o){const r=await fetch(u,{cache:'no-store',credentials:'include',...o}),j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(j.error||`HTTP ${r.status}`),{data:j});return j}let providers=[];async function load(){const g=await api('/api/providers/gateway');providers=g.providers.filter(x=>x.configured);provider.innerHTML=providers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');await loadModels()}async function loadModels(){const r=await api('/api/providers/models?provider='+encodeURIComponent(provider.value));model.innerHTML=r.models.filter(x=>x.healthy).map(x=>`<option value="${x.model_id}">${x.name||x.model_id}${x.freeCapable?' · free':''}</option>`).join('')}provider.onchange=loadModels;run.onclick=async()=>{status.textContent='Testing…';output.textContent='';const started=performance.now();try{const r=await api('/api/providers/playground',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:provider.value,modelId:model.value,feature:feature.value,prompt:prompt.value})});output.textContent=JSON.stringify({provider:r.provider,model:r.model,latencyMs:r.latencyMs,usage:r.usage,routing:r.routing,text:r.text},null,2);status.textContent=`Success · ${Math.round(performance.now()-started)} ms round trip`}catch(e){output.textContent=JSON.stringify(e.data||{error:e.message},null,2);status.textContent='Failed'} };load().catch(e=>status.textContent=e.message)</script></body></html>
